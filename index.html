<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="慢">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>慢 MANDÀ · Mandarin Study</title>
<style>
@font-face{font-family:'Noto Sans SC';src:local('PingFang SC'),local('Hiragino Sans GB'),local('Microsoft YaHei'),local('Heiti SC');}
:root{
  --bg:#0c0e0d; --bg2:#141816; --bg3:#1d2320; --card:#141816; --card2:#1d2320;
  --line:#283029; --line2:#39443b;
  --txt:#f3f6f3; --txt2:#a9b4ac; --txt3:#6c776f;
  --jade:#36e0a0;       /* primary accent — jade green */
  --jadedim:#36e0a022;
  --verm:#ff5a52;       /* vermilion — errors / "again" */
  --vermdim:#ff5a5222;
  --gold:#f5c451;       /* gold — highlights / streak */
  --golddim:#f5c45122;
  --blue:#5aa9ff;
  --r:18px; --r2:13px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Archivo','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  background-image:radial-gradient(1100px 480px at 80% -8%, #14201a 0%, transparent 60%),
                   radial-gradient(900px 420px at -10% 12%, #1a1512 0%, transparent 55%);
  background-attachment:fixed;
}
.zh{font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
.display{font-family:'Oswald','Archivo Narrow',Impact,sans-serif;font-weight:700;letter-spacing:.5px;text-transform:uppercase}

/* fonts via CDN — degrade gracefully offline to system */
/* (loaded below) */

#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:90px}
.page{padding:18px 16px 8px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.topbar .sub{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--jade)}
.topbar h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:34px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--txt);font-size:18px;flex:0 0 auto}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-h .t{font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:.5px;text-transform:uppercase}
.small{font-size:13px;color:var(--txt2);line-height:1.5}

/* buttons */
.btn{width:100%;background:var(--jade);color:#062016;border:none;border-radius:14px;padding:16px;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:10px 14px;font-size:13px;width:auto}
.btn.gold{background:var(--gold);color:#241c06}
.btn.verm{background:var(--verm);color:#260b0a}
.btn:disabled{opacity:.5}

/* menu tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;cursor:pointer;
  position:relative;overflow:hidden;transition:.18s;text-align:left}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:26px;margin-bottom:10px;display:block}
.tile .nm{display:block;font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:.5px;text-transform:uppercase}
.tile .ds{display:block;font-size:11px;color:var(--txt2);margin-top:3px;line-height:1.35}
.tile.wide{grid-column:1/-1}
.tile .badge{position:absolute;top:12px;right:12px;background:var(--jade);color:#062016;font-size:11px;font-weight:800;
  border-radius:20px;padding:2px 9px;font-family:'Archivo',sans-serif}
.tile.due{border-color:var(--jade)}
.tile .accentbar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--jade)}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .v{font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;line-height:1}
.stat .v small{font-size:15px;color:var(--txt2)}
.stat .l{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);margin-top:6px}

/* flashcard */
.fc-wrap{perspective:1400px;margin:8px 0 18px}
.flashcard{position:relative;width:100%;height:340px;cursor:pointer;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flashcard.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center}
.fc-face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#14201a,#14181b)}
.fc-hanzi{font-size:74px;font-weight:600;line-height:1.1;margin-bottom:8px}
.fc-pinyin{font-size:24px;color:var(--jade);font-weight:600;letter-spacing:.5px}
.fc-eng{font-size:26px;font-weight:600}
.fc-tag{position:absolute;top:16px;left:16px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3)}
.fc-speak{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:50%;background:var(--bg3);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px}
.fc-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--txt3)}

/* SRS grade buttons */
.grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.grade{padding:14px 4px;border-radius:13px;border:1px solid var(--line);background:var(--card2);
  font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:.15s}
.grade:active{transform:scale(.95)}
.grade .iv{display:block;font-size:10px;font-family:'Archivo',sans-serif;color:var(--txt3);margin-top:3px;font-weight:600;letter-spacing:0;text-transform:none}
.grade.again{border-color:var(--verm);color:var(--verm)}
.grade.hard{border-color:var(--gold);color:var(--gold)}
.grade.good{border-color:var(--jade);color:var(--jade)}
.grade.easy{border-color:var(--blue);color:var(--blue)}

/* progress bar */
.pbar{height:6px;background:var(--bg3);border-radius:6px;overflow:hidden;margin:2px 0 16px}
.pbar i{display:block;height:100%;background:var(--jade);border-radius:6px;transition:width .3s}
.counter{font-size:13px;color:var(--txt2);font-weight:600;text-align:center;margin-bottom:6px}

/* quiz options */
.opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:10px;cursor:pointer;transition:.15s;font-size:16px;display:flex;align-items:center;gap:12px}
.opt:active{transform:scale(.99)}
.opt .key{width:26px;height:26px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--txt2);flex:0 0 auto}
.opt.correct{border-color:var(--jade);background:var(--jadedim)}
.opt.correct .key{background:var(--jade);color:#062016}
.opt.wrong{border-color:var(--verm);background:var(--vermdim)}
.opt.wrong .key{background:var(--verm);color:#260b0a}
.qprompt{text-align:center;padding:24px 12px;margin-bottom:8px}
.qprompt .big{font-size:56px;font-weight:600;line-height:1.1}
.qprompt .mid{font-size:30px;font-weight:600;color:var(--jade)}
.qprompt .lbl{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--txt3);margin-bottom:10px}

/* sentence builder */
.sb-target{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;text-align:center}
.sb-target .en{font-size:18px;font-weight:600}
.sb-build{min-height:64px;background:var(--bg3);border:1.5px dashed var(--line2);border-radius:14px;padding:12px;
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:14px}
.sb-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.word-chip{background:var(--card2);border:1px solid var(--line2);border-radius:11px;padding:10px 14px;
  font-size:18px;cursor:pointer;transition:.12s;user-select:none}
.word-chip:active{transform:scale(.94)}
.word-chip.placed{background:var(--jadedim);border-color:var(--jade)}
.sb-build .word-chip{background:var(--jade);color:#062016;border-color:var(--jade)}

/* word list rows (dictionary / favorites / mistakes) */
.wrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:9px}
.wrow .hz{font-size:24px;font-weight:600;flex:0 0 auto;min-width:54px}
.wrow .meta{flex:1;min-width:0}
.wrow .py{font-size:14px;color:var(--jade);font-weight:600}
.wrow .en{font-size:14px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis}
.wrow .act{display:flex;gap:6px;flex:0 0 auto}
.wrow .act button{width:36px;height:36px;border-radius:10px;background:var(--bg3);border:1px solid var(--line);font-size:16px}
.star.on{color:var(--gold)}

/* unit select */
.unit-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.unit-row.on{border-color:var(--jade);background:var(--jadedim)}
.unit-row .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#062016}
.unit-row.on .chk{background:var(--jade);border-color:var(--jade)}
.unit-row .info{flex:1}
.unit-row .nm{font-weight:600;font-size:15px}
.unit-row .ct{font-size:12px;color:var(--txt2);margin-top:2px}
.unit-row .prog{font-size:11px;color:var(--jade);font-weight:700}

/* chips / toggles */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card2);border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;
  font-size:14px;font-weight:600;cursor:pointer;transition:.15s;color:var(--txt)}
.chip.on{background:var(--jade);color:#062016;border-color:var(--jade)}

/* field */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);margin-bottom:7px}
.inp{width:100%;background:var(--bg3);border:1.5px solid var(--line);border-radius:12px;padding:13px;color:var(--txt);
  font-size:15px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--jade)}
textarea.inp{min-height:120px;resize:vertical}

/* bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,14,13,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px env(safe-area-inset-bottom);z-index:50;max-width:560px;margin:0 auto}
#nav button{background:none;border:none;color:var(--txt3);font-size:10px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;flex:1;cursor:pointer}
#nav button .ni{font-size:21px}
#nav button.on{color:var(--jade)}

/* result screen */
.result-big{text-align:center;padding:30px 0 14px}
.result-big .pct{font-family:'Oswald',sans-serif;font-weight:700;font-size:72px;line-height:1;color:var(--jade)}
.result-big .msg{font-size:16px;color:var(--txt2);margin-top:8px}
.ring{width:160px;height:160px;margin:0 auto}

/* modal */
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;
  display:none;align-items:flex-end;justify-content:center}
#modalWrap.show{display:flex}
#modal{background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:560px;
  padding:24px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideup .3s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
#modal h3{font-family:'Oswald',sans-serif;font-weight:600;font-size:21px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px}

/* toast */
#toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);
  border:1px solid var(--line2);border-radius:13px;padding:12px 18px;font-size:14px;font-weight:600;z-index:200;
  opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.good{border-color:var(--jade)} #toast.bad{border-color:var(--verm)}

.divider{height:1px;background:var(--line);margin:18px 0}
.center{text-align:center}
.tag-pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;background:var(--bg3);color:var(--txt2)}
.coach{background:linear-gradient(160deg,#14201a,#161a17);border:1px solid var(--jade);border-radius:14px;padding:14px;margin-top:12px}
.coach .cl{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--jade);margin-bottom:6px}
.coach p{font-size:14px;line-height:1.55;color:var(--txt)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"><div id="screen"></div></div>
<nav id="nav"></nav>
<div id="modalWrap" onclick="if(event.target.id==='modalWrap')closeModal()"><div id="modal"></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
