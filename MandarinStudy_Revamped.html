                const state = this.stateManager.state;
                const card = state.quizCards[state.quizIndex];
                const cardId = this.srsManager.getCardId(card.question);
                
                // Grade card in SRS system
                this.srsManager.gradeCard(cardId, quality);
                
                // Record in session (2+ is correct)
                this.sessionManager.recordAnswer(quality >= 2);
                
                // Move to next card
                if (state.quizIndex + 1 < state.quizCards.length) {
                    this.stateManager.setState({
                        quizIndex: state.quizIndex + 1,
                        answered: false,
                        showAnswer: false
                    });
                    
                    // Auto-play next card if enabled
                    if (state.settings.autoPlayAudio) {
                        setTimeout(() => {
                            this.playListeningAudio();
                        }, 300);
                    }
                } else {
                    this.stateManager.setState({ mode: 'results' });
                }
            }

            /* ========================================
               HELPER METHODS
            ======================================== */
            getAllUnits() {
                const state = this.stateManager.state;
                const hidden = state.hiddenUnits || [];
                const allUnits = {};

                // Add preset units (skip hidden ones)
                Object.entries(PRESET_UNITS).forEach(([key, unit]) => {
                    if (!hidden.includes(key)) allUnits[key] = unit;
                });
                
                // Add custom units (skip hidden ones)
                Object.entries(state.customUnits).forEach(([key, words]) => {
                    if (!hidden.includes(key)) {
                        allUnits[key] = {
                            name: state.customUnitNames[key] || key,
                            words
                        };
                    }
                });
                
                return allUnits;
            }

            getAllCards() {
                const allUnits = this.getAllUnits();
                const allCards = [];
                Object.values(allUnits).forEach(unit => {
                    allCards.push(...unit.words);
                });
                return allCards;
            }

            getSelectedCards() {
                const state = this.stateManager.state;
                const allUnits = this.getAllUnits();
                const cards = [];
                
                state.selectedUnits.forEach(unitKey => {
                    if (allUnits[unitKey]) {
                        cards.push(...allUnits[unitKey].words);
                    }
                });
                
                return cards;
            }

            getSelectedCardsCount() {
                return this.getSelectedCards().length;
            }

            getTotalCardsCount() {
                return this.getAllCards().length;
            }

            getDueCardsCount() {
                const allCards = this.getAllCards();
                return this.srsManager.getDueCards(allCards).length;
            }

            getNextInterval(cardId, quality) {
                const srsData = this.stateManager.state.srsData[cardId];
                if (!srsData) return '1d';
                
                // Simplified interval calculation for display
                if (quality === 0) return '< 1m';
                if (quality === 1) return '< 10m';
                
                let interval = srsData.interval;
                if (quality === 3) {
                    interval = Math.round(interval * srsData.easeFactor * 1.3);
                } else {
                    interval = Math.round(interval * srsData.easeFactor);
                }
                
                if (interval < 1) return '< 1d';
                if (interval === 1) return '1d';
                if (interval < 30) return `${interval}d`;
                if (interval < 365) return `${Math.round(interval / 30)}mo`;
                return `${Math.round(interval / 365)}y`;
            }

            shuffle(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }
        }

        /* ========================================
           INITIALIZE APP
        ======================================== */
        const app = new MandarinStudyApp();
    </script>
