                            ${state.studyMode === 'sentenceBuilder' ? `
                                <div class="card mb-4" style="background: var(--warning-light); border-color: var(--warning);">
                                    <div class="flex items-start gap-2">
                                        <div class="text-xl">⚠️</div>
                                        <div class="text-sm">
                                            <div class="font-semibold" style="color: var(--warning)">Sentence Builder Notice</div>
                                            <div style="color: var(--text-secondary)">
                                                Works best with preset vocabulary. May not generate meaningful sentences from custom imported units.
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                            <div class="sticky-bottom">
                                <button onclick="app.startStudyMode()" class="btn btn-primary btn-lg w-full">
                                    Start Studying (${this.getSelectedCardsCount()} cards)
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            renderFlashcards() {
                const state = this.stateManager.state;
                const card = state.cards[state.currentIndex];
                if (!card) return this.renderResults();
                
                const progress = ((state.currentIndex + 1) / state.cards.length) * 100;
                const isFavorited = state.favorites.includes(this.srsManager.getCardId(card));
                const cardId = this.srsManager.getCardId(card);
                const srsData = this.srsManager.getCardStats(cardId);
                
                return `
                    <div class="container animate-fadeIn" style="max-width: 800px;">
                        <!-- Header -->
                        <div class="mb-6">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-2xl font-bold">Flashcards</h2>
                                <button onclick="app.goToMenu()" class="btn btn-ghost">✕</button>
                            </div>
                            
                            <!-- Progress -->
                            <div class="mb-2 flex justify-between text-sm" style="color: var(--text-secondary)">
                                <span>Card ${state.currentIndex + 1} of ${state.cards.length}</span>
                                <span>${Math.round(progress)}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <!-- Flashcard -->
                        <div 
                            class="flashcard ${state.showAnswer ? 'flipped' : ''} mb-6"
                            onclick="app.toggleFlashcard()"
                        >
                            <div class="flashcard-inner">
                                <!-- Front -->
                                <div class="flashcard-face">
                                    <div class="text-center">
                                        <div class="text-6xl font-bold mb-4">${card.hanzi}</div>
                                        ${state.settings.showPinyin ? `
                                            <div class="text-2xl" style="color: var(--text-secondary)">${card.pinyin}</div>
                                        ` : ''}
                                        <div class="mt-8 text-sm" style="color: var(--text-tertiary)">
                                            Tap or press Space to reveal
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Back -->
                                <div class="flashcard-face flashcard-back">
                                    <div class="text-center">
                                        <div class="text-4xl font-bold mb-4">${card.english}</div>
                                        <div class="text-2xl mb-2" style="color: var(--text-secondary)">${card.pinyin}</div>
                                        <div class="text-xl" style="color: var(--text-tertiary)">${card.hanzi}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Audio Control -->
                        <div class="mb-4 text-center">
                            <button 
                                onclick="app.speakCurrentCard()" 
                                class="btn btn-primary"
                            >
                                🔊 Pronounce
                            </button>
                        </div>

                        <!-- SRS Info -->
                        ${srsData ? `
                            <div class="card mb-6">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <div class="text-sm" style="color: var(--text-secondary)">Status</div>
                                        <div class="badge badge-${srsData.difficulty === 'easy' ? 'success' : srsData.difficulty === 'medium' ? 'primary' : 'warning'} mt-1">
                                            ${srsData.difficulty === 'new' ? 'New' : srsData.difficulty === 'learning' ? 'Learning' : srsData.difficulty === 'medium' ? 'Medium' : 'Mastered'}
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-sm" style="color: var(--text-secondary)">Reviews</div>
                                        <div class="text-xl font-bold">${srsData.reviewCount}</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-sm" style="color: var(--text-secondary)">Interval</div>
                                        <div class="text-xl font-bold">${srsData.interval}d</div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}

                        <!-- Controls -->
                        <div class="flex gap-3 mb-4">
                            <button 
                                onclick="app.toggleFavorite()"
                                class="btn ${isFavorited ? 'btn-warning' : 'btn-secondary'} flex-1"
                            >
                                ${isFavorited ? '⭐ Favorited' : '☆ Favorite'}
                            </button>
                            <button onclick="app.previousFlashcard()" class="btn btn-secondary btn-icon" ${state.currentIndex === 0 ? 'disabled' : ''}>
                                ←
                            </button>
                            <button onclick="app.nextFlashcard()" class="btn btn-primary btn-icon">
                                →
                            </button>
                        </div>

                        <!-- SRS Grading (if answer is shown) -->
                        ${state.showAnswer && state.studyMode === 'srsReview' ? `
                            <div class="grid grid-cols-4 gap-2">
                                <button onclick="app.gradeCard(0)" class="btn btn-error">
                                    Again<br><small>< 1m</small>
                                </button>
                                <button onclick="app.gradeCard(1)" class="btn btn-warning">
                                    Hard<br><small>< 10m</small>
                                </button>
                                <button onclick="app.gradeCard(2)" class="btn btn-primary">
                                    Good<br><small>${this.getNextInterval(cardId, 2)}</small>
                                </button>
                                <button onclick="app.gradeCard(3)" class="btn btn-success">
                                    Easy<br><small>${this.getNextInterval(cardId, 3)}</small>
                                </button>
                            </div>
                        ` : ''}

                        <!-- Keyboard Hints -->
                        <div class="text-center text-sm mt-6" style="color: var(--text-tertiary)">
                            <div>⌨️ Arrow keys: Navigate | Space: Flip | F: Favorite | Esc: Menu</div>
                        </div>
                    </div>
                `;
            }

            renderQuiz() {
                const state = this.stateManager.state;
                const card = state.quizCards[state.quizIndex];
                if (!card) return this.renderResults();
                
                const progress = ((state.quizIndex + 1) / state.quizCards.length) * 100;
                const options = card.options;
                
                return `
                    <div class="container animate-fadeIn" style="max-width: 800px;">
                        <!-- Header -->
                        <div class="mb-6">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-2xl font-bold">Quiz</h2>
                                <div class="flex gap-2 items-center">
                                    <div class="badge badge-success">${state.score} / ${state.quizIndex}</div>
                                    <button onclick="app.goToMenu()" class="btn btn-ghost">✕</button>
                                </div>
                            </div>
                            
                            <!-- Progress -->
                            <div class="mb-2 flex justify-between text-sm" style="color: var(--text-secondary)">
                                <span>Question ${state.quizIndex + 1} of ${state.quizCards.length}</span>
                                <span>${Math.round(progress)}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <!-- Question -->
                        <div class="card mb-6 text-center">
                            <div class="text-5xl font-bold mb-4">${card.question.hanzi}</div>
                            ${state.settings.showPinyin ? `
                                <div class="text-2xl" style="color: var(--text-secondary)">${card.question.pinyin}</div>
                            ` : ''}
                        </div>

                        <!-- Options -->
                        <div class="grid gap-3 mb-6">
                            ${options.map((opt, idx) => {
                                let btnClass = 'btn-secondary';
                                let icon = `<span class="opacity-50">${idx + 1}</span>`;
                                
                                if (state.answered) {
                                    if (opt === card.correctAnswer) {
                                        btnClass = 'btn-success';
                                        icon = '✓';
                                    } else if (state.selectedAnswer === idx) {
                                        btnClass = 'btn-error animate-shake';
                                        icon = '✗';
                                    }
                                }
                                
                                return `
                                    <button 
                                        onclick="app.selectQuizAnswer(${idx})"
                                        class="btn ${btnClass} btn-lg text-left"
                                        style="justify-content: flex-start;"
                                        ${state.answered ? 'disabled' : ''}
                                    >
                                        <span class="font-bold mr-3">${icon}</span>
                                        <span>${opt}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- Next Button -->
                        ${state.answered ? `
                            <button onclick="app.nextQuizCard()" class="btn btn-primary btn-lg w-full">
                                ${state.quizIndex + 1 < state.quizCards.length ? 'Next Question →' : 'See Results'}
                            </button>
                        ` : ''}

                        <!-- Keyboard Hints -->
                        <div class="text-center text-sm mt-6" style="color: var(--text-tertiary)">
                            <div>⌨️ Number keys 1-4: Select answer | Enter: Next | Esc: Menu</div>
                        </div>
                    </div>
                `;
            }

            renderSRSReview() {
                // Use same flashcard interface but with SRS grading
                return this.renderFlashcards();
            }

            renderSentenceBuilder() {
                const state = this.stateManager.state;
                const scenario = state.currentScenario;
                if (!scenario) return this.renderResults();
                
                const progress = ((state.sentenceIndex + 1) / state.sentenceScenarios.length) * 100;
                const availableWords = this.getAvailableWords();
                const filteredWords = state.searchQuery 
                    ? availableWords.filter(w => 
                        w.hanzi.includes(state.searchQuery) || 
                        w.pinyin.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                        w.english.toLowerCase().includes(state.searchQuery.toLowerCase())
                    )
                    : availableWords;
                
                return `
                    <div class="container animate-fadeIn">
                        <!-- Header -->
                        <div class="mb-6">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-2xl font-bold">Sentence Builder</h2>
                                <button onclick="app.goToMenu()" class="btn btn-ghost">✕</button>
                            </div>
                            
                            <!-- Disclaimer -->
                            <div class="card mb-4" style="background: var(--accent-light); border-color: var(--accent-primary);">
                                <div class="flex items-start gap-3">
                                    <div class="text-2xl">ℹ️</div>
                                    <div>
                                        <div class="font-semibold" style="color: var(--accent-primary)">Grammar-Aware Sentence Builder</div>
                                        <div class="text-sm" style="color: var(--text-secondary)">
                                            This mode uses proper Chinese grammar rules (SVO structure, time/place before verb, etc.). 
                                            It requires balanced vocabulary: <strong>subjects (我, 你, 他), verbs (to eat, to go), and nouns (school, car)</strong>. 
                                            Word order must be grammatically correct to pass!
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Progress -->
                            <div class="mb-2 flex justify-between text-sm" style="color: var(--text-secondary)">
                                <span>Sentence ${state.sentenceIndex + 1} of ${state.sentenceScenarios.length}</span>
                                <span>${Math.round(progress)}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <!-- Prompt -->
                        <div class="card mb-6">
                            <div class="text-lg font-semibold mb-2">Build this sentence:</div>
                            <div class="text-2xl font-bold" style="color: var(--accent-primary)">${scenario.english}</div>
                        </div>

                        <!-- Selected Words -->
                        <div class="card mb-6" style="min-height: 100px;">
                            <div class="text-sm font-semibold mb-3" style="color: var(--text-secondary)">Your sentence:</div>
                            ${state.selectedWords.length > 0 ? `
                                <div class="flex flex-wrap gap-2">
                                    ${state.selectedWords.map((word, idx) => `
                                        <button 
                                            onclick="app.removeWord(${idx})"
                                            class="badge badge-primary"
                                            style="padding: 0.5rem 1rem; font-size: 1.125rem; cursor: pointer;"
                                        >
                                            ${word.hanzi} <span class="ml-2">✕</span>
                                        </button>
                                    `).join('')}
                                </div>
                            ` : `
                                <div class="text-center" style="color: var(--text-tertiary)">
                                    Select words from below to build your sentence
                                </div>
                            `}
                        </div>

                        <!-- Search -->
                        <div class="mb-4">
                            <input 
                                type="text"
                                class="input"
                                placeholder="🔍 Search words..."
                                value="${state.searchQuery}"
                                data-input-id="searchQuery"
                                oninput="app.updateSearch(this.value)"
                            />
                        </div>

                        <!-- Word Bank -->
                        <div class="mb-6">
                            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2" style="max-height: 400px; overflow-y: auto;">
                                ${filteredWords.map(word => `
                                    <button 
                                        onclick="app.addWord(${JSON.stringify(word).replace(/"/g, '&quot;')})"
                                        class="card card-interactive text-center"
                                        style="padding: 1rem;"
                                    >
                                        <div class="text-2xl font-bold mb-1">${word.hanzi}</div>
                                        <div class="text-sm" style="color: var(--text-secondary)">${word.pinyin}</div>
                                        <div class="text-xs mt-1" style="color: var(--text-tertiary)">${word.english}</div>
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="sticky-bottom">
                            ${!state.answered ? `
                                <button 
                                    onclick="app.checkSentence()"
                                    class="btn btn-primary btn-lg w-full"
                                    ${state.selectedWords.length === 0 ? 'disabled' : ''}
                                >
                                    Check Answer
                                </button>
                            ` : `
                                <div class="mb-4">
                                    ${state.selectedWords.map(w => w.hanzi).join(' ') === scenario.answer ? `
                                        <div class="card animate-pulse" style="background: var(--success-light); border-color: var(--success);">
                                            <div class="flex items-center gap-3">
                                                <div class="text-3xl">✓</div>
                                                <div>
                                                    <div class="font-bold" style="color: var(--success)">Correct!</div>
                                                    <div class="text-sm">${scenario.answer}</div>
                                                    ${scenario.pattern ? `
                                                        <div class="text-xs mt-2" style="color: var(--text-tertiary)">
                                                            Pattern: ${scenario.pattern}
                                                        </div>
                                                    ` : ''}
                                                    ${scenario.hasHiddenWord ? `
                                                        <div class="text-xs mt-2" style="color: var(--text-tertiary)">
                                                            Note: Contains "${scenario.hiddenWord.hanzi}" (${scenario.hiddenWord.pinyin}) - ${scenario.hiddenWord.english}
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="card animate-shake" style="background: var(--error-light); border-color: var(--error);">
                                            <div class="mb-3">
                                                <div class="flex items-center gap-3 mb-2">
                                                    <div class="text-3xl">✗</div>
                                                    <div class="font-bold" style="color: var(--error)">Not quite right - word order matters!</div>
                                                </div>
                                                <div class="text-sm"><strong>Correct answer:</strong> ${scenario.answer}</div>
                                                ${scenario.pattern ? `
                                                    <div class="text-xs mt-2" style="color: var(--text-secondary)">
                                                        Pattern: ${scenario.pattern} (Chinese grammar rule)
                                                    </div>
                                                ` : ''}
                                                ${scenario.hasHiddenWord ? `
                                                    <div class="text-xs mt-2" style="color: var(--text-secondary)">
                                                        Note: This sentence needs "${scenario.hiddenWord.hanzi}" (${scenario.hiddenWord.pinyin}) - ${scenario.hiddenWord.english}
                                                    </div>
                                                ` : ''}
                                            </div>
                                        </div>
                                    `}
                                </div>
                                <button onclick="app.nextSentence()" class="btn btn-primary btn-lg w-full">
                                    ${state.sentenceIndex + 1 < state.sentenceScenarios.length ? 'Next Sentence →' : 'Finish'}
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }

            renderListeningQuiz() {
                const state = this.stateManager.state;
                const card = state.quizCards[state.quizIndex];
                if (!card) return this.renderResults();
                
                const progress = ((state.quizIndex + 1) / state.quizCards.length) * 100;
                
                return `
                    <div class="container animate-fadeIn" style="max-width: 800px;">
                        <!-- Header -->
                        <div class="mb-6">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-2xl font-bold">Listening Quiz</h2>
                                <div class="flex gap-2 items-center">
                                    <button onclick="app.goToMenu()" class="btn btn-ghost">✕</button>
                                </div>
                            </div>
                            
                            <!-- Progress -->
                            <div class="mb-2 flex justify-between text-sm" style="color: var(--text-secondary)">
                                <span>Card ${state.quizIndex + 1} of ${state.quizCards.length}</span>
                                <span>${Math.round(progress)}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="card mb-6 text-center">
                            <div class="text-6xl font-bold mb-4">${card.question.hanzi}</div>
                            <div class="text-3xl mb-4" style="color: var(--text-secondary)">${card.question.english}</div>
                            ${state.showAnswer ? `
                                <div class="text-2xl animate-fadeIn" style="color: var(--accent-primary)">
                                    ${card.question.pinyin}
                                </div>

                                <button onclick="app.showHint()" class="btn btn-secondary btn-sm mt-2">
                                    💡 Show Pinyin
                                </button>
                            `}
                        </div>

                        <!-- Audio Controls -->
                        <div class="mb-6">
                            <button 
                                onclick="app.playListeningAudio()"
                                class="btn btn-primary btn-lg w-full mb-4"
                            >
                                🔊 Play Pronunciation
                            </button>
                            
                            <div class="grid grid-cols-3 gap-2">
                                <button 
                                    onclick="app.setSetting('speechSpeed', 'slow'); app.playListeningAudio();"
                                    class="btn ${state.settings.speechSpeed === 'slow' ? 'btn-primary' : 'btn-secondary'}"
                                >
                                    🐢 Slow
                                </button>
                                <button 
                                    onclick="app.setSetting('speechSpeed', 'normal'); app.playListeningAudio();"
                                    class="btn ${state.settings.speechSpeed === 'normal' ? 'btn-primary' : 'btn-secondary'}"
                                >
                                    ▶️ Normal
                                </button>
                                <button 
                                    onclick="app.setSetting('speechSpeed', 'fast'); app.playListeningAudio();"
                                    class="btn ${state.settings.speechSpeed === 'fast' ? 'btn-primary' : 'btn-secondary'}"
                                >

            renderRecover() {
                const state = this.stateManager.state;
                const hidden = state.hiddenUnits || [];
                const trash = state.unitTrash || {};
                const trashNames = state.unitTrashNames || {};

                const hiddenPresets = hidden.map(key => ({
                    key,
                    name: PRESET_UNITS[key] ? PRESET_UNITS[key].name : key,
                    wordCount: PRESET_UNITS[key] ? PRESET_UNITS[key].words.length : 0,
                    type: 'preset'
                }));

                const trashedCustom = Object.keys(trash).map(key => ({
                    key,
                    name: trashNames[key] || key,
                    wordCount: (trash[key] || []).length,
                    type: 'custom'
                }));

                const allDeleted = [...hiddenPresets, ...trashedCustom];

                let itemsHtml = '';
                if (allDeleted.length === 0) {
                    itemsHtml = '<div class="card text-center" style="padding:3rem;">'
                        + '<div class="text-5xl mb-4">✅</div>'
                        + '<h2 class="text-xl font-bold mb-2">Nothing deleted</h2>'
                        + '<p style="color:var(--text-secondary);">Any units you delete will appear here so you can restore them.</p>'
                        + '</div>';
                } else {
                    allDeleted.forEach(function(item) {
                        const badge = item.type === 'preset'
                            ? '<span style="background:var(--bg-tertiary);color:var(--text-secondary);font-size:0.75rem;padding:0.2rem 0.6rem;border-radius:9999px;font-weight:600;">Preset</span>'
                            : '<span style="background:var(--accent-light);color:var(--accent-primary);font-size:0.75rem;padding:0.2rem 0.6rem;border-radius:9999px;font-weight:600;">Custom</span>';
                        const permBtn = item.type === 'custom'
                            ? '<button onclick="app.permanentlyDeleteUnit(\'' + item.key + '\')" class="btn btn-error btn-sm">Delete Forever</button>'
                            : '';
                        itemsHtml += '<div class="card mb-3" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;">'
                            + '<div style="display:flex;align-items:center;gap:0.75rem;flex:1;min-width:0;">'
                            + '<div>'
                            + '<div style="font-weight:700;font-size:1.1rem;">' + item.name + '</div>'
                            + '<div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.25rem;">'
                            + badge
                            + '<span style="font-size:0.85rem;color:var(--text-secondary);">' + item.wordCount + ' words</span>'
                            + '</div></div></div>'
                            + '<div style="display:flex;gap:0.5rem;flex-shrink:0;">'
                            + '<button onclick="app.recoverUnit(\'' + item.key + '\')" class="btn btn-success btn-sm">↩ Restore</button>'
                            + permBtn
                            + '</div></div>';
                    });
                }

                return '<div class="container animate-fadeIn" style="max-width:700px;">'
                    + '<div class="flex justify-between items-center mb-6">'
                    + '<div><h1 class="text-3xl font-bold">♻️ Recover Units</h1>'
                    + '<p style="color:var(--text-secondary);">' + allDeleted.length + ' deleted unit' + (allDeleted.length !== 1 ? 's' : '') + '</p></div>'
                    + '<button onclick="app.goToMenu()" class="btn btn-ghost">← Back</button>'
                    + '</div>'
                    + '<div class="card mb-6" style="background:var(--warning-light);border-color:var(--warning);padding:1rem;">'
                    + '<p style="color:var(--text-primary);font-size:0.9rem;">🔄 <strong>Restore</strong> puts a unit back. <strong>Delete Forever</strong> (custom units only) removes it permanently and cannot be undone.</p>'
                    + '</div>'
                    + itemsHtml
                    + '</div>';
            }

            renderDictionary() {
                const state = this.stateManager.state;
                const allUnits = this.getAllUnits();
                const search = (state.dictSearch || '').toLowerCase();
                const DICT_KEY = 'custom_dictionary';

                // Build sections from all units PLUS the My Dictionary custom unit even if hidden
                const dictWords = (state.customUnits && state.customUnits[DICT_KEY]) || [];
                const unitsToShow = Object.assign({}, allUnits);
                // Always show My Dictionary section if it has words
                if (dictWords.length > 0 && !unitsToShow[DICT_KEY]) {
                    unitsToShow[DICT_KEY] = { name: 'My Dictionary', words: dictWords };
                }

                const sections = Object.entries(unitsToShow).map(([key, unit]) => {
                    const words = search
                        ? unit.words.filter(w =>
                            w.hanzi.includes(search) ||
                            w.pinyin.toLowerCase().includes(search) ||
                            w.english.toLowerCase().includes(search)
                          )
                        : unit.words;
                    return { key, name: unit.name, words, isDict: key === DICT_KEY, isCustom: key.startsWith('custom_') };
                }).filter(s => s.words.length > 0);

                const totalWords = sections.reduce((sum, s) => sum + s.words.length, 0);

                // Add word form HTML
                const addForm = '<div class="card mb-6" style="border-color:var(--accent-primary);">'
                    + '<h2 class="text-lg font-bold mb-3">➕ Add Word to My Dictionary</h2>'
                    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:0.5rem;align-items:end;">'
                    + '<div><label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:0.25rem;">汉字</label>'
                    + '<input type="text" class="input" placeholder="e.g. 猫" value="' + (state.dictNewHanzi || '').replace(/"/g,'&quot;') + '" oninput="app.stateManager.setState({dictNewHanzi:this.value})" data-input-id="dict-hanzi" style="font-size:1.2rem;" /></div>'
                    + '<div><label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:0.25rem;">Pinyin</label>'
                    + '<input type="text" class="input" placeholder="e.g. māo" value="' + (state.dictNewPinyin || '').replace(/"/g,'&quot;') + '" oninput="app.stateManager.setState({dictNewPinyin:this.value})" data-input-id="dict-pinyin" /></div>'
                    + '<div><label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:0.25rem;">English</label>'
                    + '<input type="text" class="input" placeholder="e.g. cat" value="' + (state.dictNewEnglish || '').replace(/"/g,'&quot;') + '" oninput="app.stateManager.setState({dictNewEnglish:this.value})" data-input-id="dict-english" /></div>'
                    + '<button onclick="app.addDictWord()" class="btn btn-primary" style="white-space:nowrap;">Add</button>'
                    + '</div></div>';

                let sectionsHtml = '';
                if (sections.length === 0) {
                    sectionsHtml = '<div class="card text-center" style="padding:3rem;"><div class="text-4xl mb-4">🔍</div><p style="color:var(--text-secondary)">No words match your search.</p></div>';
                } else {
                    sections.forEach(function(section) {
                        let rowsHtml = '';
                        section.words.forEach(function(word, idx) {
                            const safeHanzi = word.hanzi.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                            const stripe = idx % 2 === 1 ? 'background:var(--bg-secondary);' : '';
                            const deleteBtn = section.isDict
                                ? '<button onclick="app.removeDictWord(' + idx + ')" class="btn btn-ghost btn-sm" style="padding:0.25rem 0.5rem;color:var(--error);" title="Remove">✕</button>'
                                : '';
                            rowsHtml += '<tr style="border-bottom:1px solid var(--border-primary);' + stripe + '">'
                                + '<td style="padding:0.75rem 1rem;font-size:1.4rem;font-weight:700;">' + word.hanzi + '</td>'
                                + '<td style="padding:0.75rem 1rem;color:var(--text-secondary);">' + word.pinyin + '</td>'
                                + '<td style="padding:0.75rem 1rem;">' + word.english + '</td>'
                                + '<td style="padding:0.75rem 0.5rem;text-align:center;white-space:nowrap;">'
                                + '<button onclick="app.speakCard(\'' + safeHanzi + '\')" class="btn btn-ghost btn-sm" style="padding:0.25rem 0.5rem;">🔊</button>'
                                + deleteBtn
                                + '</td></tr>';
                        });
                        const customBadge = section.isDict
                            ? '<span style="background:var(--success-light);color:var(--success);font-size:0.75rem;padding:0.2rem 0.6rem;border-radius:9999px;font-weight:600;">My Words</span>'
                            : section.isCustom
                                ? '<span style="background:var(--accent-light);color:var(--accent-primary);font-size:0.75rem;padding:0.2rem 0.6rem;border-radius:9999px;font-weight:600;">Custom</span>'
                                : '<span style="background:var(--bg-tertiary);color:var(--text-secondary);font-size:0.75rem;padding:0.2rem 0.6rem;border-radius:9999px;font-weight:600;">Preset</span>';
                        sectionsHtml += '<div class="mb-8">'
                            + '<div class="flex items-center gap-3 mb-3">'
                            + '<h2 class="text-xl font-bold">' + section.name + '</h2>'
                            + customBadge
                            + '<span class="text-sm" style="color:var(--text-tertiary);">' + section.words.length + ' words</span>'
                            + '<div style="flex:1;height:1px;background:var(--border-primary);margin-left:0.5rem;"></div>'

                            + '<div class="card" style="padding:0;overflow:hidden;">'
                            + '<table style="width:100%;border-collapse:collapse;">'
                            + '<thead><tr style="background:var(--bg-tertiary);border-bottom:1px solid var(--border-primary);">'

                            + '<th style="padding:0.6rem 1rem;text-align:left;font-size:0.8rem;color:var(--text-secondary);font-weight:600;">English</th>'

                            + '</tr></thead>'
                            + '<tbody>' + rowsHtml + '</tbody>'
                            + '</table></div></div>';
                    });
                }

                return '<div class="container animate-fadeIn" style="max-width:900px;">'
                    + '<div class="flex justify-between items-center mb-6">'
                    + '<div><h1 class="text-3xl font-bold">📖 Dictionary</h1>'
                    + '<p style="color:var(--text-secondary);">' + totalWords + ' words across ' + sections.length + ' sections</p></div>'
                    + '<button onclick="app.goToMenu()" class="btn btn-ghost">← Back</button>'
                    + '</div>'
                    + addForm
                    + '<div class="mb-6"><input type="text" class="input" placeholder="🔍 Search by 汉字, pinyin, or English…" value="' + (state.dictSearch || '').replace(/"/g, '&quot;') + '" oninput="app.stateManager.setState({dictSearch:this.value})" data-input-id="dict-search" /></div>'
                    + sectionsHtml
                    + '</div>';
            }

            renderMistakeReview() {
                const state = this.stateManager.state;
                const allUnits = this.getAllUnits();
                const mistakeCards = [];
                
                // Gather all mistake cards
                state.mistakeQueue.forEach(cardId => {
                    Object.values(allUnits).forEach(unit => {
                        const word = unit.words.find(w => this.srsManager.getCardId(w) === cardId);
                        if (word && !mistakeCards.find(c => this.srsManager.getCardId(c) === cardId)) {
                            mistakeCards.push(word);
                        }
                    });
                });
                
                if (mistakeCards.length === 0) {
                    return `
                        <div class="container animate-fadeIn text-center" style="padding-top: 3rem;">
                            <div class="text-6xl mb-4">✓</div>
                            <h2 class="text-2xl font-bold mb-4">No Mistakes to Review</h2>
                            <p class="mb-6" style="color: var(--text-secondary)">
                                Great job! Keep practicing to stay sharp
                            </p>
                            <button onclick="app.goToMenu()" class="btn btn-primary">
                                Back to Menu
                            </button>
                        </div>
                    `;
                }
                
                return `
                    <div class="container animate-fadeIn">
                        <!-- Header -->
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h1 class="text-3xl font-bold">❌ Mistake Review</h1>
                                <p style="color: var(--text-secondary)">${mistakeCards.length} cards to review</p>
                            </div>
                            <button onclick="app.goToMenu()" class="btn btn-ghost">← Back</button>
                        </div>

                        <!-- Study Mistakes Button -->
                        <button onclick="app.studyMistakes()" class="btn btn-primary btn-lg w-full mb-6">
                            📚 Review Mistakes
                        </button>

                        <!-- Clear Queue Button -->
                        <button onclick="app.clearMistakeQueue()" class="btn btn-secondary w-full mb-6">
                            Clear Mistake Queue
                        </button>

                        <!-- Mistakes List -->
                        <div class="grid-responsive">
                            ${mistakeCards.map(card => {
                                const cardId = this.srsManager.getCardId(card);
                                const srsData = this.srsManager.getCardStats(cardId);
                                
                                return `
                                    <div class="card">
                                        <div class="text-3xl font-bold mb-1">${card.hanzi}</div>
                                        <div class="mb-1" style="color: var(--text-secondary)">${card.pinyin}</div>
                                        <div class="text-lg mb-3">${card.english}</div>
                                        ${srsData ? `
                                            <div class="text-sm" style="color: var(--text-secondary)">
                                                Reviewed ${srsData.reviewCount} times
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;

            /* ========================================
               NAVIGATION ACTIONS
            ======================================== */
            goToMenu() {
                this.stateManager.setState({ 
                    mode: 'menu',
                    menuCategory: null 
                });
            }

            setMenuCategory(category) {
                this.stateManager.setState({ menuCategory: category });
            }

            goToImport() {
                // Clear any previous import state/errors
                this.stateManager.setState({ 
                    mode: 'importUnit',
                    uploadedImage: null,
                    isProcessing: false,
                    ocrText: '',
                    parsedVocab: [],
                    bulkText: null,
                    unitName: '',
                    formatterInput: '',
                    formatterOutput: ''
                });
            }

            goToStats() {
                this.stateManager.setState({ mode: 'stats' });
            }

            goToSettings() {
                this.stateManager.setState({ mode: 'settings' });
            }

            goToFavorites() {
                this.stateManager.setState({ mode: 'favorites' });
            }

            goToMistakeReview() {
                this.stateManager.setState({ mode: 'mistakeReview' });
            }

            selectMode(mode) {
                this.stateManager.setState({ 
                    studyMode: mode,
                    mode: 'selectUnits',
                    selectedUnits: [],
                    menuCategory: null
                });
            }

            /* ========================================
               UNIT SELECTION
            ======================================== */
            toggleUnit(unitKey) {
                const state = this.stateManager.state;
                const selected = state.selectedUnits.includes(unitKey);
                
                const selectedUnits = selected
                    ? state.selectedUnits.filter(k => k !== unitKey)
                    : [...state.selectedUnits, unitKey];
                
                this.stateManager.setState({ selectedUnits });
            }

            selectAllUnits() {
                const allUnits = this.getAllUnits();
                this.stateManager.setState({ 
                    selectedUnits: Object.keys(allUnits)
                });
            }

            deselectAllUnits() {
                this.stateManager.setState({ selectedUnits: [] });
            }

            /* ========================================
               STUDY MODE STARTERS
            ======================================== */
            startStudyMode() {
                const state = this.stateManager.state;
                const cards = this.getSelectedCards();
                
                if (cards.length === 0) {
                    alert('Please select at least one unit');
                    return;
                }
                
                this.sessionManager.startSession(state.studyMode, cards);
                
                switch (state.studyMode) {
                    case 'flashcards':
                        this.startFlashcards(cards);
                        break;
                    case 'quiz':
                        this.startQuiz(cards);
                        break;
                    case 'listeningQuiz':
                        this.startListeningQuiz(cards);
                        break;
                    case 'sentenceBuilder':
                        this.startSentenceBuilder(cards);
                        break;
                }
            }

            startFlashcards(cards) {
                const shuffled = this.shuffle([...cards]);
                this.stateManager.setState({
                    mode: 'flashcards',
                    cards: shuffled,
                    currentIndex: 0,
                    showAnswer: false
                });
            }

            startQuiz(cards) {
                const shuffled = this.shuffle([...cards]);
                const quizCards = shuffled.map(card => {
                    // Use only cards from the selected pool for wrong answers
                    const otherCards = cards.filter(c => c.english !== card.english);
                    const wrongAnswers = this.shuffle(otherCards)
                        .slice(0, 3)
                        .map(c => c.english);
                    
                    const options = this.shuffle([...wrongAnswers, card.english]);
                    
                    return {
                        question: card,
                        options,
                        correctAnswer: card.english
                    };
                });
                
                this.stateManager.setState({
                    mode: 'quiz',
                    quizCards,
                    quizIndex: 0,
                    score: 0,
                    answered: false,
                    selectedAnswer: null
                });
            }

            startListeningQuiz(cards) {
                const shuffled = this.shuffle([...cards]);
                const quizCards = shuffled.slice(0, 20).map(card => ({
                    question: card,
                    correctAnswer: card.hanzi
                }));
                
                this.stateManager.setState({
                    mode: 'listeningQuiz',
                    quizCards,
                    quizIndex: 0,
                    score: 0,
                    answered: false,
                    selectedAnswer: null,
                    spokenText: '',
                    showAnswer: false,
                    listeningActive: false
                });
            }

            startSentenceBuilder(cards) {
                // Use the grammar engine to generate proper Chinese sentences
                const sentences = this.grammarEngine.generateSentences(cards);
                
                if (sentences.length === 0) {
                    alert('Not enough vocabulary variety for sentence builder!\n\nYou need:\n• Subject words (我, 你, 他)\n• Verb words (to eat, to go, etc.)\n• Noun/object words (school, car, etc.)\n\nTry selecting multiple preset units or using Flashcards mode instead!');
                    this.goToMenu();
                    return;
                }
                
                // Shuffle and limit to 20 sentences
                const shuffled = this.shuffle(sentences).slice(0, 20);
                
                this.stateManager.setState({
                    mode: 'sentenceBuilder',
                    sentenceScenarios: shuffled,
                    sentenceIndex: 0,
                    currentScenario: shuffled[0],
                    selectedWords: [],
                    answered: false,
                    searchQuery: ''
                });
            }

            startSRSReview() {
                const allCards = this.getAllCards();
                const dueCards = this.srsManager.getDueCards(allCards);
                
                if (dueCards.length === 0) {
                    alert('No cards due for review!');
                    return;
                }
                
                this.sessionManager.startSession('srsReview', dueCards);
                this.stateManager.setState({
                    mode: 'flashcards',
                    studyMode: 'srsReview',
                    cards: this.shuffle(dueCards),
                    currentIndex: 0,
                    showAnswer: false
                });
            }

            studyFavorites() {
                const state = this.stateManager.state;
                const allUnits = this.getAllUnits();
                const favoriteCards = [];
                
                Object.values(allUnits).forEach(unit => {
                    unit.words.forEach(word => {
                        const cardId = this.srsManager.getCardId(word);
                        if (state.favorites.includes(cardId)) {
                            favoriteCards.push(word);
                        }
                    });
                });
                
                if (favoriteCards.length === 0) return;
                
                this.sessionManager.startSession('favorites', favoriteCards);
                this.startFlashcards(favoriteCards);
            }

            studyMistakes() {
                const state = this.stateManager.state;
                const allUnits = this.getAllUnits();
                const mistakeCards = [];
                
                state.mistakeQueue.forEach(cardId => {
                    Object.values(allUnits).forEach(unit => {
                        const word = unit.words.find(w => this.srsManager.getCardId(w) === cardId);
                        if (word && !mistakeCards.find(c => this.srsManager.getCardId(c) === cardId)) {
                            mistakeCards.push(word);
                        }
                    });
                });
                
                if (mistakeCards.length === 0) return;
                
                this.sessionManager.startSession('mistakes', mistakeCards);
                this.startFlashcards(mistakeCards);
            }

            retrySession() {
                const state = this.stateManager.state;
                if (state.studyMode === 'quiz') {
                    this.startQuiz(state.quizCards.map(c => c.question));
                } else if (state.studyMode === 'sentenceBuilder') {
                    this.startSentenceBuilder(this.getSelectedCards());
                } else {
                    this.startFlashcards(state.cards);
                }
            }

            /* ========================================
               FLASHCARD ACTIONS
            ======================================== */
            toggleFlashcard() {
                const state = this.stateManager.state;
                const newShowAnswer = !state.showAnswer;
                this.stateManager.setState({ showAnswer: newShowAnswer });
                
                // Auto-play if enabled and showing front
                if (!newShowAnswer && state.settings.autoPlayAudio) {
                    const card = state.cards[state.currentIndex];
                    if (card) {
                        this.speechManager.speak(card.hanzi);
                    }
                }
            }

            nextFlashcard() {
                const state = this.stateManager.state;
                if (state.currentIndex + 1 < state.cards.length) {
                    this.stateManager.setState({
                        currentIndex: state.currentIndex + 1,
                        showAnswer: false
                    });
                    
                    // Auto-play if enabled
                    if (state.settings.autoPlayAudio) {
                        const card = state.cards[state.currentIndex + 1];
                        if (card) {
                            setTimeout(() => {
                                this.speechManager.speak(card.hanzi);
                            }, 100);
                        }
                    }
                } else {
                    this.stateManager.setState({ mode: 'results' });
                }
            }

            previousFlashcard() {
                const state = this.stateManager.state;
                if (state.currentIndex > 0) {
                    this.stateManager.setState({
                        currentIndex: state.currentIndex - 1,
                        showAnswer: false
                    });
                }
            }

            gradeCard(quality) {
                const state = this.stateManager.state;
                const card = state.cards[state.currentIndex];
                const cardId = this.srsManager.getCardId(card);
                
                this.srsManager.gradeCard(cardId, quality);
                this.sessionManager.recordAnswer(quality >= 2);
                this.nextFlashcard();
            }

            toggleFavorite() {
                const state = this.stateManager.state;
                const card = state.cards[state.currentIndex];
                const cardId = this.srsManager.getCardId(card);
                
                const favorites = state.favorites.includes(cardId)
                    ? state.favorites.filter(f => f !== cardId)
                    : [...state.favorites, cardId];
                
                this.stateManager.setState({ favorites });
            }

            updateFormatterInput(value) {

            formatText() {
                const input = this.stateManager.state.formatterInput;
                if (!input || !input.trim()) {
                    alert('Please paste some text first!');
                    return;
                }
                
                // Clean and format the text
                let text = input
                    .replace(/\r\n/g, '\n')     // Normalize line endings
                    .replace(/\*/g, '')          // Remove asterisks
                    .replace(/…/g, '...')        // Replace ellipsis
                    .trim();
                
                const lines = text.split('\n');
                const formatted = [];
                let currentEntry = '';
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    // Check if this line looks like the start of a new entry (has Chinese characters)
                    const hasChinese = /[\u4E00-\u9FFF]/.test(line);
                    const hasEnglish = /[a-zA-Z]/.test(line);
                    
                    if (hasChinese && currentEntry && hasEnglish) {
                        // This line has both Chinese and English, likely a complete or new entry
                        // First, save any accumulated entry
                        if (currentEntry.trim()) {
                            formatted.push(currentEntry.trim());
                        }
                        currentEntry = line;
                    } else if (hasChinese && !currentEntry) {
                        // Start of first entry
                        currentEntry = line;
                    } else if (currentEntry && !hasChinese) {
                        // Continuation line (no Chinese, just English)
                        currentEntry += ' ' + line;
                    } else if (currentEntry) {
                        // Add to current entry
                        currentEntry += ' ' + line;
                    } else {
                        // Line without Chinese, might be continuation
                        currentEntry += line;
                    }
                }
                
                // Don't forget the last entry
                if (currentEntry.trim()) {
                    formatted.push(currentEntry.trim());
                }
                
                // Join with tabs for easy parsing
                const output = formatted.map(entry => {
                    // Split entry into parts
                    const parts = entry.split(/\s+/);
                    let hanzi = '';
                    let pinyin = '';
                    let english = [];
                    
                    for (const part of parts) {
                        if (/[\u4E00-\u9FFF？]/.test(part)) {
                            hanzi += (hanzi ? ' ' : '') + part;
                        } else if (/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(part) || (pinyin && !hanzi)) {
                            pinyin += (pinyin ? ' ' : '') + part;
                        } else if (/[a-z]/i.test(part) && !pinyin) {
                            // First Latin word might be pinyin if no tone marks found yet
                            if (!english.length) {
                                pinyin += (pinyin ? ' ' : '') + part;
                            } else {
                                english.push(part);
                            }
                        } else {
                            english.push(part);
                        }
                    }
                    
                    // If we couldn't separate properly, try simpler approach
                    if (!hanzi || !pinyin || !english.length) {
                        const simple = entry.match(/^([^\s]+)\s+([^\s]+)\s+(.+)$/);
                        if (simple) {
                            return `${simple[1]}\t${simple[2]}\t${simple[3]}`;
                        }
                    }
                    
                    return `${hanzi}\t${pinyin}\t${english.join(' ')}`;
                }).join('\n');
                
                this.stateManager.setState({ formatterOutput: output });
            }

            async handleImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const imageUrl = URL.createObjectURL(file);
                this.stateManager.setState({
                    uploadedImage: imageUrl,
                    isProcessing: true,
                    ocrText: 'Processing image with Google Cloud Vision...'
                });
                
                try {
                    // Convert image to base64
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = () => reject(new Error('Failed to read file'));
                        reader.readAsDataURL(file);
                    });
                    
                    // Call Google Cloud Vision API
                    const API_KEY = ''; // API KEY REMOVED - Use manual entry instead
                    
                    if (!API_KEY) {
                        throw new Error('Image OCR is disabled. Please use "Paste Text" or "Manual Entry" instead.');
                    }
                    
                    const response = await fetch(
                        `https://vision.googleapis.com/v1/images:annotate?key=${API_KEY}`,
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                requests: [{
                                    image: { content: base64Data },
                                    features: [{ 
                                        type: 'TEXT_DETECTION',
                                        maxResults: 1
                                    }]
                                }]
                            })
                        }
                    );
                    
                    if (!response.ok) {
                        throw new Error(`API error: ${response.status} ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.responses && data.responses[0].fullTextAnnotation) {
                        const text = data.responses[0].fullTextAnnotation.text;
                        
                        this.stateManager.setState({
                            ocrText: 'Processing complete!',
                            bulkText: text,
                            isProcessing: false
                        });
                        
                        this.parseBulkText();
                    } else {
                        throw new Error('No text detected in image');
                    }
                } catch (error) {
                    console.error('OCR Error:', error);
                    this.stateManager.setState({
                        ocrText: 'Error: ' + error.message,
                        isProcessing: false
                    });
                    alert('OCR failed: ' + error.message + '\n\nPlease try:\n- A clearer image\n- Better lighting\n- Or paste text manually');
                }
            }

            parseBulkText() {
                const state = this.stateManager.state;
                const text = state.bulkText.trim();
                if (!text) return;
                
                const parsed = this.parseVocabularyText(text);
                this.stateManager.setState({ parsedVocab: parsed });
            }

            parseVocabularyText(text) {
                // Clean up the text first
                text = text
                    .replace(/\r\n/g, '\n')  // Normalize line endings
                    .replace(/\*/g, '')       // Remove asterisks
                    .trim();
                
                const lines = text.split('\n').filter(l => l.trim());
                const vocab = [];
                
                // Check if this is tab-separated (from formatter or clean paste)
                const firstLine = lines[0] || '';
                const isTabSeparated = firstLine.includes('\t') && firstLine.split('\t').length >= 3;
                
                if (isTabSeparated) {
                    // Simple parsing for tab-separated text
                    for (let line of lines) {
                        const parts = line.split('\t').map(p => p.trim()).filter(p => p);
                        if (parts.length >= 3) {
                            vocab.push({
                                hanzi: parts[0],
                                pinyin: parts[1],
                                english: parts.slice(2).join(' ')
                            });
                        }
                    }
                    return vocab;
                }
                
                // Complex parsing for messy text with line breaks
                let i = 0;
                while (i < lines.length) {
                    let line = lines[i].trim();
                    
                    // Try to parse this line
                    let parsed = this.parseVocabLine(line);
                    
                    // If parsing failed or incomplete, try joining with next line(s)
                    while (i + 1 < lines.length && (!parsed || !parsed.hanzi || !parsed.pinyin || !parsed.english)) {
                        i++;
                        line += ' ' + lines[i].trim();
                        parsed = this.parseVocabLine(line);
                    }
                    
                    if (parsed && parsed.hanzi && parsed.pinyin && parsed.english) {
                        vocab.push(parsed);
                    }
                    
                    i++;
                }
                
                return vocab;
            }

            parseVocabLine(line) {
                // Remove extra whitespace
                line = line.replace(/\s+/g, ' ').trim();
                
                // Try different separators in order of preference
                let parts = [];
                
                if (line.includes('\t')) {
                    parts = line.split('\t');
                } else if (line.includes('|')) {
                    parts = line.split('|');
                } else if (line.includes(',')) {
                    parts = line.split(',');
                } else {
                    // Space-separated - need to be smarter
                    parts = this.smartSplit(line);
                }
                
                parts = parts.map(p => p.trim()).filter(p => p);
                
                if (parts.length < 3) {
                    return null;
                }
                
                // Identify which part is which
                let hanzi = '';
                let pinyin = '';
                let english = '';
                
                // First part with Chinese characters is hanzi
                const hanziPart = parts.find(p => this.hasChinese(p));
                if (hanziPart) {
                    hanzi = hanziPart;
                    parts = parts.filter(p => p !== hanziPart);
                }
                
                // Next part with Latin letters but no uppercase start (usually) is pinyin
                // Or part with tone marks (ā á ǎ à etc)
                const pinyinPart = parts.find(p => 
                    this.hasPinyin(p) || 
                    (p.match(/[a-z]/i) && !this.isEnglish(p))
                );
                if (pinyinPart) {
                    pinyin = pinyinPart;
                    parts = parts.filter(p => p !== pinyinPart);
                }
                
                // Everything else is English
                english = parts.join(' ');
                
                // Fallback: if we couldn't identify properly, use order
                if (!hanzi || !pinyin || !english) {
                    const original = line.split(/[\s\t,|]+/).filter(p => p);
                    if (original.length >= 3) {
                        hanzi = hanzi || original[0];
                        pinyin = pinyin || original[1];
                        english = english || original.slice(2).join(' ');
                    }
                }
                
                return { hanzi, pinyin, english };
            }

            smartSplit(line) {
                // Split on spaces but try to group English words together
                const parts = [];
                let current = '';
                let lastWasChinese = false;
                let lastWasLatin = false;
                
                const chars = line.split('');
                for (let i = 0; i < chars.length; i++) {
                    const char = chars[i];
                    const isChinese = this.isChinese(char);
                    const isSpace = char === ' ';
                    
                    if (isSpace) {
                        const nextChar = chars[i + 1];
                        const nextIsChinese = nextChar && this.isChinese(nextChar);
                        
                        // If transitioning between Chinese and Latin, split
                        if ((lastWasChinese && !nextIsChinese) || (!lastWasChinese && nextIsChinese)) {
                            if (current.trim()) {
                                parts.push(current.trim());
                                current = '';
                            }
                        } else {
                            current += char;
                        }
                    } else {
                        current += char;
                        lastWasChinese = isChinese;
                    }
                }
                
                if (current.trim()) {
                    parts.push(current.trim());
                }
                
                return parts.length >= 3 ? parts : line.split(/\s+/);
            }

            isChinese(char) {
                const code = char.charCodeAt(0);
                return (code >= 0x4E00 && code <= 0x9FFF) || // CJK Unified Ideographs
                       (code >= 0x3400 && code <= 0x4DBF) || // CJK Extension A
                       (code >= 0x20000 && code <= 0x2A6DF); // CJK Extension B
            }

            hasChinese(str) {
                return /[\u4E00-\u9FFF\u3400-\u4DBF]/.test(str);
            }

            hasPinyin(str) {
                // Check for pinyin tone marks
                return /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(str);
            }

            isEnglish(str) {
                // Likely English if it starts with capital letter or contains common English words
                return /^[A-Z]/.test(str) || 
                       /\b(the|to|a|an|in|on|at|for|of|with|is|are|was|were)\b/i.test(str);
            }

            deleteCustomUnit(unitKey) {
                if (!confirm('Delete this unit? You can recover it from the Recover page.')) return;
                const state = this.stateManager.state;
                const isPreset = !!PRESET_UNITS[unitKey];
                const selectedUnits = state.selectedUnits.filter(k => k !== unitKey);

                if (isPreset) {
                    // Soft-delete preset: just hide it
                    const hiddenUnits = [...(state.hiddenUnits || []), unitKey];
                    this.stateManager.setState({ hiddenUnits, selectedUnits });
                } else {
                    // Soft-delete custom: move to trash
                    const customUnits = { ...state.customUnits };
                    const customUnitNames = { ...state.customUnitNames };
                    const trash = { ...(state.unitTrash || {}) };
                    const trashNames = { ...(state.unitTrashNames || {}) };
                    trash[unitKey] = customUnits[unitKey];
                    trashNames[unitKey] = customUnitNames[unitKey] || unitKey;
                    delete customUnits[unitKey];
                    delete customUnitNames[unitKey];
                    this.stateManager.setState({ customUnits, customUnitNames, unitTrash: trash, unitTrashNames: trashNames, selectedUnits });
                }
            }

            recoverUnit(unitKey) {
                const state = this.stateManager.state;
                const isPreset = !!PRESET_UNITS[unitKey];

                if (isPreset) {
                    const hiddenUnits = (state.hiddenUnits || []).filter(k => k !== unitKey);
                    this.stateManager.setState({ hiddenUnits });
                } else {
                    const trash = { ...(state.unitTrash || {}) };
                    const trashNames = { ...(state.unitTrashNames || {}) };
                    const customUnits = { ...state.customUnits };
                    const customUnitNames = { ...state.customUnitNames };
                    if (trash[unitKey]) {
                        customUnits[unitKey] = trash[unitKey];
                        customUnitNames[unitKey] = trashNames[unitKey] || unitKey;
                        delete trash[unitKey];
                        delete trashNames[unitKey];
                    }
                    this.stateManager.setState({ customUnits, customUnitNames, unitTrash: trash, unitTrashNames: trashNames });
                }
            }
