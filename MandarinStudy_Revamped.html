<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>普通话 Study - Mandarin Learning Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ========================================
           CSS VARIABLES & THEME SYSTEM
        ======================================== */
        :root {
            /* Light Theme Colors */
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-card: #ffffff;
            --bg-hover: #f1f5f9;
            --bg-active: #e2e8f0;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --text-inverse: #ffffff;
            
            --border-primary: #e2e8f0;
            --border-secondary: #cbd5e1;
            --border-focus: #3b82f6;
            
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: #dbeafe;
            
            --success: #10b981;
            --success-light: #d1fae5;
            --success-dark: #059669;
            
            --error: #ef4444;
            --error-light: #fee2e2;
            --error-dark: #dc2626;
            
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            
            --transition-fast: 150ms;
            --transition-normal: 250ms;
            --transition-slow: 350ms;
        }

        /* Dark Theme */
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --bg-active: #475569;
            
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-tertiary: #64748b;
            --text-inverse: #0f172a;
            
            --border-primary: #334155;
            --border-secondary: #475569;
            --border-focus: #60a5fa;
            
            --accent-primary: #60a5fa;
            --accent-hover: #3b82f6;
            --accent-light: #1e3a8a;
            
            --success: #34d399;
            --success-light: #064e3b;
            --success-dark: #10b981;
            
            --error: #f87171;
            --error-light: #7f1d1d;
            --error-dark: #ef4444;
            
            --warning: #fbbf24;
            --warning-light: #78350f;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.6);
        }

        /* ========================================
           GLOBAL STYLES
        ======================================== */
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color var(--transition-normal), color var(--transition-normal);
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ========================================
           RESPONSIVE LAYOUT SYSTEM
        ======================================== */
        .container {
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
        }

        @media (min-width: 640px) {
            .container {
                padding: 1.5rem;
            }
        }

        @media (min-width: 768px) {
            .container {
                max-width: 768px;
                padding: 2rem;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 1024px;
            }
        }

        @media (min-width: 1280px) {
            .container {
                max-width: 1200px;
            }
        }

        /* Desktop Multi-Column Layouts */
        .grid-responsive {
            display: grid;
            gap: 1rem;
            grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .grid-responsive {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
        }

        @media (min-width: 1024px) {
            .grid-responsive {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ========================================
           BUTTON SYSTEM
        ======================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            white-space: nowrap;
            user-select: none;
            outline: none;
        }

        .btn:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        @media (min-width: 768px) {
            .btn {
                padding: 0.625rem 1.25rem;
                font-size: 0.9375rem;
            }
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--text-inverse);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--border-secondary);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: var(--success-dark);
        }

        .btn-error {
            background: var(--error);
            color: white;
        }

        .btn-error:hover {
            background: var(--error-dark);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-icon {
            padding: 0.625rem;
            aspect-ratio: 1;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-lg {
            padding: 1rem 2rem;
            font-size: 1.125rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ========================================
           CARD SYSTEM
        ======================================== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        @media (min-width: 768px) {
            .card {
                padding: 2rem;
            }
        }

        .card-interactive {
            cursor: pointer;
        }

        .card-interactive:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-primary);
        }

        .card-interactive:active {
            transform: translateY(0);
        }

        /* ========================================
           FORM ELEMENTS
        ======================================== */
        .input, .textarea, .select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--transition-fast);
            outline: none;
        }

        .input:focus, .textarea:focus, .select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        /* ========================================
           ANIMATIONS
        ======================================== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }

        .animate-slideInRight {
            animation: slideInRight 0.3s ease-out;
        }

        .animate-slideInLeft {
            animation: slideInLeft 0.3s ease-out;
        }

        .animate-scaleIn {
            animation: scaleIn 0.2s ease-out;
        }

        .animate-shake {
            animation: shake 0.5s ease-out;
        }

        .animate-pulse {
            animation: pulse 0.3s ease-out;
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ========================================
           PROGRESS BARS
        ======================================== */
        .progress-bar {
            width: 100%;
            height: 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-primary);
            border-radius: 9999px;
            transition: width var(--transition-normal);
        }

        .progress-fill-success {
            background: var(--success);
        }

        /* ========================================
           BADGES & CHIPS
        ======================================== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .badge-primary {
            background: var(--accent-light);
            color: var(--accent-primary);
        }

        .badge-success {
            background: var(--success-light);
            color: var(--success-dark);
        }

        .badge-error {
            background: var(--error-light);
            color: var(--error-dark);
        }

        .badge-warning {
            background: var(--warning-light);
            color: var(--warning);
        }

        /* ========================================
           MODAL SYSTEM
        ======================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: scaleIn 0.2s ease-out;
        }

        /* ========================================
           FLASHCARD STYLES
        ======================================== */
        .flashcard {
            position: relative;
            width: 100%;
            aspect-ratio: 3/2;
            perspective: 1000px;
            cursor: pointer;
            user-select: none;
        }

        @media (min-width: 768px) {
            .flashcard {
                aspect-ratio: 4/3;
            }
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-radius: var(--radius-xl);
            background: var(--bg-card);
            border: 2px solid var(--border-primary);
            box-shadow: var(--shadow-lg);
        }

        .flashcard-back {
            transform: rotateY(180deg);
        }

        /* ========================================
           UTILITY CLASSES
        ======================================== */
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }

        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }

        .text-sm { font-size: 0.875rem; }
        .text-base { font-size: 1rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }

        @media (min-width: 768px) {
            .text-3xl { font-size: 2.25rem; }
            .text-4xl { font-size: 3rem; }
        }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .gap-8 { gap: 2rem; }

        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mt-8 { margin-top: 2rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }

        .w-full { width: 100%; }
        .h-full { height: 100%; }

        .opacity-50 { opacity: 0.5; }
        .opacity-75 { opacity: 0.75; }

        .hidden { display: none; }

        /* ========================================
           STICKY ELEMENTS (Mobile)
        ======================================== */
        .sticky-bottom {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-primary);
            padding: 1rem;
            box-shadow: 0 -4px 6px -1px rgb(0 0 0 / 0.1);
            z-index: 10;
        }

        @media (min-width: 768px) {
            .sticky-bottom {
                position: static;
                border-top: none;
                box-shadow: none;
                padding: 0;
            }
        }

        /* ========================================
           SCROLLBAR STYLING
        ======================================== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-secondary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* ========================================
           TOUCH OPTIMIZATIONS
        ======================================== */
        @media (max-width: 767px) {
            .btn {
                min-height: 44px;
                min-width: 44px;
            }
        }

        /* ========================================
           ICONS (Using Unicode)
        ======================================== */
        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-style: normal;
        }

        /* ========================================
           STATS DISPLAY
        ======================================== */
        .stat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary);
            line-height: 1;
        }

        .stat-label {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* ========================================
           COLORBLIND MODE
        ======================================== */
        [data-colorblind="true"] {
            --success: #0077BB;
            --error: #EE7733;
            --warning: #CCBB44;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        /* ========================================
           STATE MANAGEMENT SYSTEM
        ======================================== */
        class StateManager {
            constructor() {
                this.state = this.loadState();
                this.listeners = [];
                this.theme = this.detectTheme();
                this.applyTheme(this.theme);
            }

            loadState() {
                try {
                    const saved = localStorage.getItem('mandarinStudyState');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        // Migrate old state if needed
                        return this.migrateState(parsed);
                    }
                } catch (e) {
                    console.error('Failed to load state:', e);
                }
                return this.getDefaultState();
            }

            getDefaultState() {
                return {
                    // Navigation
                    mode: 'menu',
                    menuCategory: null, // null, 'study', or 'actions'
                    selectedUnits: [],
                    studyMode: '',
                    
                    // Units
                    customUnits: {},
                    customUnitNames: {},
                    
                    // Flashcards
                    cards: [],
                    currentIndex: 0,
                    showAnswer: false,
                    
                    // Quiz
                    quizCards: [],
                    quizIndex: 0,
                    score: 0,
                    answered: false,
                    selectedAnswer: null,
                    
                    // Sentence Builder
                    sentenceScenarios: [],
                    currentScenario: null,
                    selectedWords: [],
                    sentenceIndex: 0,
                    
                    // Import
                    searchQuery: '',
                    uploadedImage: null,
                    isProcessing: false,
                    ocrText: '',
                    parsedVocab: [],
                    unitName: '',
                    bulkText: null,
                    
                    // Text Formatter
                    formatterInput: '',
                    formatterOutput: '',
                    
                    // Dictionary
                    dictSearch: '',
                    hiddenUnits: [],
                    dictNewHanzi: '',
                    dictNewPinyin: '',
                    dictNewEnglish: '',
                    unitTrash: {},
                    unitTrashNames: {},
                    
                    // SRS (Spaced Repetition System)
                    srsData: {},
                    
                    // Progress & Stats
                    studyStreak: 0,
                    lastStudyDate: null,
                    totalStudyTime: 0,
                    sessionStartTime: null,
                    stats: {
                        totalCards: 0,
                        cardsStudied: 0,
                        correctAnswers: 0,
                        incorrectAnswers: 0,
                        averageAccuracy: 0
                    },
                    
                    // Settings
                    settings: {
                        theme: 'auto',
                        fontSize: 'medium',
                        showPinyin: true,
                        autoPlayAudio: false,
                        speechSpeed: 'normal', // slow, normal, fast
                        studyDirection: 'both',
                        colorblindMode: false,
                        reducedMotion: false
                    },
                    
                    // Speaking Quiz
                    listeningActive: false,
                    spokenText: '',
                    
                    // Favorites
                    favorites: [],
                    
                    // Mistake Review
                    mistakeQueue: [],
                    
                    // Session
                    currentSession: null
                };
            }

            migrateState(oldState) {
                const defaultState = this.getDefaultState();
                return { ...defaultState, ...oldState };
            }

            saveState() {
                try {
                    localStorage.setItem('mandarinStudyState', JSON.stringify(this.state));
                } catch (e) {
                    console.error('Failed to save state:', e);
                }
            }

            setState(updates) {
                this.state = { ...this.state, ...updates };
                this.saveState();
                this.notifyListeners();
            }

            getState() {
                return this.state;
            }

            subscribe(listener) {
                this.listeners.push(listener);
                return () => {
                    this.listeners = this.listeners.filter(l => l !== listener);
                };
            }

            notifyListeners() {
                this.listeners.forEach(listener => listener(this.state));
            }

            detectTheme() {
                const saved = this.state?.settings?.theme || 'auto';
                if (saved === 'auto') {
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                return saved;
            }

            applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                this.theme = theme;
            }

            toggleTheme() {
                const newTheme = this.theme === 'dark' ? 'light' : 'dark';
                this.applyTheme(newTheme);
                this.setState({
                    settings: { ...this.state.settings, theme: newTheme }
                });
            }

            exportData() {
                return JSON.stringify(this.state, null, 2);
            }

            importData(jsonString) {
                try {
                    const imported = JSON.parse(jsonString);
                    this.state = this.migrateState(imported);
                    this.saveState();
                    this.notifyListeners();
                    return true;
                } catch (e) {
                    console.error('Failed to import data:', e);
                    return false;
                }
            }

            clearData() {
                if (confirm('Are you sure you want to clear all data? This cannot be undone.')) {
                    this.state = this.getDefaultState();
                    this.saveState();
                    this.notifyListeners();
                    return true;
                }
                return false;
            }
        }

        /* ========================================
           SRS (SPACED REPETITION SYSTEM)
        ======================================== */
        class SRSManager {
            constructor(stateManager) {
                this.stateManager = stateManager;
            }

            initializeCard(cardId) {
                const srsData = this.stateManager.state.srsData;
                if (!srsData[cardId]) {
                    srsData[cardId] = {
                        interval: 1,
                        easeFactor: 2.5,
                        reviewCount: 0,
                        lastReview: null,
                        nextReview: Date.now(),
                        difficulty: 'new'
                    };
                    this.stateManager.setState({ srsData });
                }
            }

            gradeCard(cardId, quality) {
                // SuperMemo SM-2 algorithm
                // quality: 0 = Again, 1 = Hard, 2 = Good, 3 = Easy
                
                this.initializeCard(cardId);
                const srsData = { ...this.stateManager.state.srsData };
                const card = srsData[cardId];
                
                card.reviewCount++;
                card.lastReview = Date.now();
                
                // Update ease factor
                const oldEaseFactor = card.easeFactor;
                card.easeFactor = Math.max(1.3, oldEaseFactor + (0.1 - (3 - quality) * (0.08 + (3 - quality) * 0.02)));
                
                // Calculate new interval
                if (quality < 2) {
                    // Failed - reset interval
                    card.interval = 1;
                    card.difficulty = 'learning';
                } else {
                    if (card.reviewCount === 1) {
                        card.interval = 1;
                    } else if (card.reviewCount === 2) {
                        card.interval = 6;
                    } else {
                        card.interval = Math.round(card.interval * card.easeFactor);
                    }
                    
                    // Update difficulty rating
                    if (card.interval >= 21) {
                        card.difficulty = 'easy';
                    } else if (card.interval >= 7) {
                        card.difficulty = 'medium';
                    } else {
                        card.difficulty = 'learning';
                    }
                }
                
                // Set next review date
                card.nextReview = Date.now() + (card.interval * 24 * 60 * 60 * 1000);
                
                this.stateManager.setState({ srsData });
                
                // Add to mistake queue if failed
                if (quality < 2) {
                    this.addToMistakeQueue(cardId);
                }
            }

            addToMistakeQueue(cardId) {
                const mistakeQueue = [...this.stateManager.state.mistakeQueue];
                if (!mistakeQueue.includes(cardId)) {
                    mistakeQueue.push(cardId);
                    this.stateManager.setState({ mistakeQueue });
                }
            }

            getDueCards(cards) {
                const now = Date.now();
                return cards.filter(card => {
                    const cardId = this.getCardId(card);
                    const srsData = this.stateManager.state.srsData[cardId];
                    if (!srsData) return true; // New cards are always due
                    return srsData.nextReview <= now;
                });
            }

            getCardId(card) {
                return `${card.hanzi}-${card.pinyin}`;
            }

            getCardStats(cardId) {
                return this.stateManager.state.srsData[cardId] || null;
            }
        }

        /* ========================================
           CHINESE GRAMMAR ENGINE
        ======================================== */
        class ChineseGrammarEngine {
            constructor() {
                // Word type identifiers
                this.subjects = ['我', '你', '他', '她', '我们', '你们', '他们'];
                this.timeWords = ['今天', '明天', '昨天', '现在', '早上', '上午', '中午', '下午', '晚上', '半夜'];
                this.placeWords = ['学校', '教室', '图书馆', '餐厅', '体育馆', '公园', '家'];
                this.verbIndicators = ['to ', 'go', 'eat', 'drink', 'study', 'play', 'watch', 'listen', 'read', 'write', 'drive', 'walk', 'run', 'sit', 'sleep'];
                this.adjectiveIndicators = ['fast', 'slow', 'good', 'bad', 'big', 'small', 'beautiful', 'ugly', 'happy', 'sad', 'busy', 'free', 'interesting', 'boring', 'difficult', 'easy'];
                this.nounIndicators = ['school', 'car', 'bus', 'book', 'food', 'water', 'tea', 'coffee', 'ball', 'music', 'movie', 'game', 'homework'];
            }

            categorizeWord(card) {
                const hanzi = card.hanzi;
                const english = card.english.toLowerCase();
                const pinyin = card.pinyin.toLowerCase();
                
                // Determine word type
                if (this.subjects.includes(hanzi)) {
                    return { type: 'subject', card };
                }
                
                if (this.timeWords.some(t => hanzi.includes(t))) {
                    return { type: 'time', card };
                }
                
                if (this.placeWords.some(p => hanzi.includes(p))) {
                    return { type: 'place', card };
                }
                
                // Check if verb (most reliable: English starts with "to")
                if (english.startsWith('to ') || this.verbIndicators.some(v => english.includes(v))) {
                    return { type: 'verb', card };
                }
                
                // Check if adjective
                if (this.adjectiveIndicators.some(a => english.includes(a))) {
                    return { type: 'adjective', card };
                }
                
                // Default to noun/object
                return { type: 'noun', card };
            }

            generateSentences(cards) {
                if (cards.length < 2) return [];
                
                // Categorize all words
                const categorized = cards.map(c => this.categorizeWord(c));
                const subjects = categorized.filter(w => w.type === 'subject');
                const verbs = categorized.filter(w => w.type === 'verb');
                const nouns = categorized.filter(w => w.type === 'noun');
                const adjectives = categorized.filter(w => w.type === 'adjective');
                const times = categorized.filter(w => w.type === 'time');
                const places = categorized.filter(w => w.type === 'place');
                
                const sentences = [];
                
                // Rule 1: Basic SVO (Subject + Verb + Object)
                if (subjects.length > 0 && verbs.length > 0 && nouns.length > 0) {
                    subjects.forEach(subj => {
                        verbs.forEach(verb => {
                            nouns.forEach(noun => {
                                sentences.push({
                                    pattern: 'SVO',
                                    words: [subj.card, verb.card, noun.card],
                                    answer: `${subj.card.hanzi} ${verb.card.hanzi} ${noun.card.hanzi}`,
                                    english: `${subj.card.english} ${verb.card.english} ${noun.card.english}`
                                });
                            });
                        });
                    });
                }
                
                // Rule 2: Time + SVO (Subject + Time + Verb + Object)
                if (subjects.length > 0 && times.length > 0 && verbs.length > 0 && nouns.length > 0) {
                    subjects.forEach(subj => {
                        times.forEach(time => {
                            verbs.forEach(verb => {
                                nouns.forEach(noun => {
                                    sentences.push({
                                        pattern: 'Time+SVO',
                                        words: [subj.card, time.card, verb.card, noun.card],
                                        answer: `${subj.card.hanzi} ${time.card.hanzi} ${verb.card.hanzi} ${noun.card.hanzi}`,
                                        english: `${subj.card.english} ${verb.card.english} ${noun.card.english} ${time.card.english}`
                                    });
                                });
                            });
                        });
                    });
                }
                
                // Rule 3: Place + SVO (Subject + Place + Verb + Object)
                if (subjects.length > 0 && places.length > 0 && verbs.length > 0 && nouns.length > 0) {
                    subjects.forEach(subj => {
                        places.forEach(place => {
                            verbs.forEach(verb => {
                                nouns.forEach(noun => {
                                    sentences.push({
                                        pattern: 'Place+SVO',
                                        words: [subj.card, place.card, verb.card, noun.card],
                                        answer: `${subj.card.hanzi} ${place.card.hanzi} ${verb.card.hanzi} ${noun.card.hanzi}`,
                                        english: `${subj.card.english} ${verb.card.english} ${noun.card.english} at ${place.card.english}`
                                    });
                                });
                            });
                        });
                    });
                }
                
                // Rule 4: Time + Place + SVO (Subject + Time + Place + Verb + Object)
                if (subjects.length > 0 && times.length > 0 && places.length > 0 && verbs.length > 0 && nouns.length > 0) {
                    subjects.forEach(subj => {
                        times.forEach(time => {
                            places.forEach(place => {
                                verbs.forEach(verb => {
                                    nouns.forEach(noun => {
                                        sentences.push({
                                            pattern: 'Time+Place+SVO',
                                            words: [subj.card, time.card, place.card, verb.card, noun.card],
                                            answer: `${subj.card.hanzi} ${time.card.hanzi} ${place.card.hanzi} ${verb.card.hanzi} ${noun.card.hanzi}`,
                                            english: `${subj.card.english} ${verb.card.english} ${noun.card.english} at ${place.card.english} ${time.card.english}`
                                        });
                                    });
                                });
                            });
                        });
                    });
                }
                
                // Rule 5: Subject + Adjective (Subject + 很 + Adjective) - no verb needed
                if (subjects.length > 0 && adjectives.length > 0) {
                    subjects.forEach(subj => {
                        adjectives.forEach(adj => {
                            sentences.push({
                                pattern: 'S+Adj',
                                words: [subj.card, adj.card],
                                answer: `${subj.card.hanzi} 很 ${adj.card.hanzi}`,
                                english: `${subj.card.english} is very ${adj.card.english}`,
                                hasHiddenWord: true,
                                hiddenWord: { hanzi: '很', pinyin: 'hěn', english: 'very' }
                            });
                        });
                    });
                }
                
                // Rule 6: Simple SV (Subject + Verb) - intransitive verbs
                if (subjects.length > 0 && verbs.length > 0) {
                    subjects.forEach(subj => {
                        verbs.forEach(verb => {
                            sentences.push({
                                pattern: 'SV',
                                words: [subj.card, verb.card],
                                answer: `${subj.card.hanzi} ${verb.card.hanzi}`,
                                english: `${subj.card.english} ${verb.card.english}`
                            });
                        });
                    });
                }
                
                // Rule 7: Verb + Object (no subject - imperative/general statement)
                if (verbs.length > 0 && nouns.length > 0) {
                    verbs.forEach(verb => {
                        nouns.forEach(noun => {
                            sentences.push({
                                pattern: 'VO',
                                words: [verb.card, noun.card],
                                answer: `${verb.card.hanzi} ${noun.card.hanzi}`,
                                english: `${verb.card.english} ${noun.card.english}`
                            });
                        });
                    });
                }
                
                return sentences;
            }

            validateSentence(userWords, correctAnswer) {
                const userSentence = userWords.map(w => w.hanzi).join(' ');
                return userSentence === correctAnswer;
            }
        }

        /* ========================================
           STUDY SESSION MANAGER
        ======================================== */
        class StudySessionManager {
            constructor(stateManager) {
                this.stateManager = stateManager;
            }

            startSession(mode, cards) {
                const session = {
                    mode,
                    startTime: Date.now(),
                    totalCards: cards.length,
                    cardsStudied: 0,
                    correct: 0,
                    incorrect: 0,
                    cards: cards.map(card => ({
                        ...card,
                        result: null,
                        timeSpent: 0
                    }))
                };
                
                this.stateManager.setState({ 
                    currentSession: session,
                    sessionStartTime: Date.now()
                });
                
                this.updateStreak();
            }

            endSession() {
                const session = this.stateManager.state.currentSession;
                if (!session) return null;
                
                const duration = Date.now() - session.startTime;
                const accuracy = session.totalCards > 0 
                    ? Math.round((session.correct / session.totalCards) * 100)
                    : 0;
                
                // Update stats
                const stats = { ...this.stateManager.state.stats };
                stats.cardsStudied += session.cardsStudied;
                stats.correctAnswers += session.correct;
                stats.incorrectAnswers += session.incorrect;
                stats.averageAccuracy = stats.cardsStudied > 0
                    ? Math.round((stats.correctAnswers / stats.cardsStudied) * 100)
                    : 0;
                
                // Update total study time
                const totalStudyTime = this.stateManager.state.totalStudyTime + duration;
                
                this.stateManager.setState({
                    currentSession: null,
                    sessionStartTime: null,
                    stats,
                    totalStudyTime
                });
                
                return {
                    ...session,
                    duration,
                    accuracy
                };
            }

            recordAnswer(correct) {
                const session = { ...this.stateManager.state.currentSession };
                if (!session) return;
                
                session.cardsStudied++;
                if (correct) {
                    session.correct++;
                } else {
                    session.incorrect++;
                }
                
                this.stateManager.setState({ currentSession: session });
            }

            updateStreak() {
                const lastStudyDate = this.stateManager.state.lastStudyDate;
                const today = new Date().toDateString();
                
                if (lastStudyDate !== today) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    
                    let streak = this.stateManager.state.studyStreak;
                    
                    if (lastStudyDate === yesterday.toDateString()) {
                        streak++;
                    } else if (lastStudyDate !== today) {
                        streak = 1;
                    }
                    
                    this.stateManager.setState({
                        studyStreak: streak,
                        lastStudyDate: today
                    });
                }
            }
        }

        /* ========================================
           SPEECH MANAGER (TTS & STT)
        ======================================== */
        class SpeechManager {
            constructor(stateManager) {
                this.stateManager = stateManager;
                this.synth = window.speechSynthesis;
                this.recognition = null;
                this.voicesLoaded = false;
                this.voices = [];
                this.setupRecognition();
                this.loadVoices();
            }

            loadVoices() {
                // Load voices immediately if available
                this.voices = this.synth.getVoices();
                
                if (this.voices.length > 0) {
                    this.voicesLoaded = true;
                    console.log('Voices loaded:', this.voices.length);
                }
                
                // Also listen for voices changed event (some browsers need this)
                if (this.synth.onvoiceschanged !== undefined) {
                    this.synth.onvoiceschanged = () => {
                        this.voices = this.synth.getVoices();
                        this.voicesLoaded = true;
                        console.log('Voices updated:', this.voices.length);
                    };
                }
            }

            setupRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    this.recognition = new SpeechRecognition();
                    this.recognition.lang = 'zh-CN';
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;
                }
            }

            speak(text, onEnd = null) {
                if (!this.synth) {
                    console.error('Speech synthesis not supported');
                    alert('Text-to-speech is not supported in your browser.');
                    return;
                }

                // Cancel any ongoing speech
                this.synth.cancel();

                // Reload voices if not loaded yet
                if (!this.voicesLoaded || this.voices.length === 0) {
                    this.voices = this.synth.getVoices();
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN'; // Mandarin Chinese
                
                // Set speech rate based on settings
                const speed = this.stateManager.state.settings.speechSpeed;
                utterance.rate = speed === 'slow' ? 0.7 : speed === 'fast' ? 1.2 : 1.0;
                
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                // Try to use a Chinese voice if available
                let chineseVoice = null;
                
                // Look for Chinese voices (prioritize zh-CN)
                chineseVoice = this.voices.find(voice => voice.lang === 'zh-CN');
                
                if (!chineseVoice) {
                    // Fallback to any Chinese voice
                    chineseVoice = this.voices.find(voice => 
                        voice.lang.startsWith('zh') ||
                        voice.name.toLowerCase().includes('chinese') ||
                        voice.name.toLowerCase().includes('mandarin')
                    );
                }
                
                if (chineseVoice) {
                    utterance.voice = chineseVoice;
                    console.log('Using voice:', chineseVoice.name, chineseVoice.lang);
                } else {
                    console.warn('No Chinese voice found. Available voices:', this.voices.map(v => v.name + ' (' + v.lang + ')'));
                    
                    // Show user-friendly warning
                    if (this.voices.length === 0) {
                        setTimeout(() => {
                            alert('No text-to-speech voices available. Please:\n\n1. Make sure your device volume is up\n2. Try a different browser (Chrome or Edge recommended)\n3. Check your system language settings');
                        }, 100);
                        return;
                    } else {
                        // Use default voice as fallback (will sound wrong but at least makes sound)
                        utterance.voice = this.voices[0];
                        console.log('Using fallback voice:', utterance.voice.name);
                    }
                }

                utterance.onerror = (event) => {
                    console.error('Speech error:', event);
                };

                utterance.onstart = () => {
                    console.log('Speech started');
                };

                if (onEnd) {
                    utterance.onend = onEnd;
                }

                // Small delay to ensure synthesis is ready
                setTimeout(() => {
                    this.synth.speak(utterance);
                    console.log('Speaking:', text);
                }, 50);
            }

            stopSpeaking() {
                if (this.synth) {
                    this.synth.cancel();
                }
            }

            startListening(onResult, onError) {
                if (!this.recognition) {
                    alert('Speech recognition not supported in your browser. Try Chrome or Edge.');
                    return false;
                }

                this.recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    onResult(transcript);
                };

                this.recognition.onerror = (event) => {
                    onError(event.error);
                };

                this.recognition.onend = () => {
                    this.stateManager.setState({ listeningActive: false });
                };

                try {
                    this.recognition.start();
                    this.stateManager.setState({ listeningActive: true });
                    return true;
                } catch (e) {
                    console.error('Recognition error:', e);
                    return false;
                }
            }

            stopListening() {
                if (this.recognition) {
                    this.recognition.stop();
                    this.stateManager.setState({ listeningActive: false });
                }
            }

            isSupported() {
                return !!(this.synth && this.recognition);
            }

            getAvailableVoices() {
                return this.voices;
            }
        }

        /* ========================================
           KEYBOARD NAVIGATION
        ======================================== */
        class KeyboardNavigationManager {
            constructor(app) {
                this.app = app;
                this.enabled = true;
                this.setupListeners();
            }

            setupListeners() {
                document.addEventListener('keydown', (e) => {
                    if (!this.enabled) return;
                    
                    const state = this.app.stateManager.state;
                    
                    // Global shortcuts
                    if (e.key === 'Escape') {
                        if (state.mode !== 'menu') {
                            this.app.goToMenu();
                        }
                    }
                    
                    // Flashcard navigation
                    if (state.mode === 'flashcards') {
                        if (e.key === ' ' || e.key === 'Enter') {
                            e.preventDefault();
                            this.app.toggleFlashcard();
                        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                            e.preventDefault();
                            this.app.nextFlashcard();
                        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                            e.preventDefault();
                            this.app.previousFlashcard();
                        } else if (e.key === 'f' || e.key === 'F') {
                            this.app.toggleFavorite();
                        }
                    }
                    
                    // Quiz navigation
                    if (state.mode === 'quiz' && state.answered) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            this.app.nextQuizCard();
                        }
                    }
                    
                    // Number keys for quiz answers
                    if (state.mode === 'quiz' && !state.answered) {
                        const num = parseInt(e.key);
                        if (num >= 1 && num <= 4) {
                            const options = this.app.getCurrentQuizOptions();
                            if (options[num - 1]) {
                                this.app.selectQuizAnswer(num - 1);
                            }
                        }
                    }
                });
            }

            enable() {
                this.enabled = true;
            }

            disable() {
                this.enabled = false;
            }
        }

        /* ========================================
           TOUCH GESTURE HANDLER
        ======================================== */
        class TouchGestureHandler {
            constructor(element, callbacks) {
                this.element = element;
                this.callbacks = callbacks;
                this.startX = 0;
                this.startY = 0;
                this.minSwipeDistance = 50;
                
                this.setupListeners();
            }

            setupListeners() {
                this.element.addEventListener('touchstart', (e) => {
                    this.startX = e.touches[0].clientX;
                    this.startY = e.touches[0].clientY;
                }, { passive: true });

                this.element.addEventListener('touchend', (e) => {
                    const endX = e.changedTouches[0].clientX;
                    const endY = e.changedTouches[0].clientY;
                    
                    const deltaX = endX - this.startX;
                    const deltaY = endY - this.startY;
                    
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > this.minSwipeDistance) {
                        if (deltaX > 0 && this.callbacks.onSwipeRight) {
                            this.callbacks.onSwipeRight();
                        } else if (deltaX < 0 && this.callbacks.onSwipeLeft) {
                            this.callbacks.onSwipeLeft();
                        }
                    }
                }, { passive: true });
            }
        }

        /* ========================================
           MAIN APP CLASS
        ======================================== */
        class MandarinStudyApp {
            constructor() {
                this.stateManager = new StateManager();
                this.srsManager = new SRSManager(this.stateManager);
                this.sessionManager = new StudySessionManager(this.stateManager);
                this.speechManager = new SpeechManager(this.stateManager);
                this.grammarEngine = new ChineseGrammarEngine();
                this.keyboardNav = new KeyboardNavigationManager(this);
                
                // Subscribe to state changes
                this.stateManager.subscribe(() => this.render());
                
                // Initial render
                this.render();
                
                // Ensure voices are loaded
                this.ensureVoicesLoaded();
                
                // Setup system theme listener
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (this.stateManager.state.settings.theme === 'auto') {
                        this.stateManager.applyTheme(e.matches ? 'dark' : 'light');
                    }
                });
            }

            ensureVoicesLoaded() {
                // Trigger voice loading by calling getVoices multiple times
                if (window.speechSynthesis) {
                    window.speechSynthesis.getVoices();
                    
                    // Try again after a short delay
                    setTimeout(() => {
                        window.speechSynthesis.getVoices();
                        this.speechManager.loadVoices();
                    }, 100);
                    
                    // And once more to be sure
                    setTimeout(() => {
                        window.speechSynthesis.getVoices();
                        this.speechManager.loadVoices();
                    }, 500);
                }
            }

            /* ========================================
               RENDERING
            ======================================== */
            render() {
                const app = document.getElementById('app');
                const state = this.stateManager.state;
                
                // Preserve scroll position and active element during re-renders
                const scrollPos = window.scrollY;
                const activeElement = document.activeElement;
                const activeElementId = activeElement ? activeElement.getAttribute('data-input-id') : null;
                const cursorPosition = activeElement && activeElement.selectionStart !== undefined ? activeElement.selectionStart : null;
                
                let content = '';
                
                switch (state.mode) {
                    case 'menu':
                        content = this.renderMenu();
                        break;
                    case 'selectUnits':
                        content = this.renderSelectUnits();
                        break;
                    case 'flashcards':
                        content = this.renderFlashcards();
                        break;
                    case 'quiz':
                        content = this.renderQuiz();
                        break;
                    case 'srsReview':
                        content = this.renderSRSReview();
                        break;
                    case 'sentenceBuilder':
                        content = this.renderSentenceBuilder();
                        break;
                    case 'listeningQuiz':
                        content = this.renderListeningQuiz();
                        break;
                    case 'importUnit':
                        content = this.renderImportUnit();
                        break;
                    case 'results':
                        content = this.renderResults();
                        break;
                    case 'stats':
                        content = this.renderStats();
                        break;
                    case 'settings':
                        content = this.renderSettings();
                        break;
                    case 'favorites':
                        content = this.renderFavorites();
                        break;
                    case 'mistakeReview':
                        content = this.renderMistakeReview();
                        break;
                    case 'dictionary':
                        content = this.renderDictionary();
                        break;
                    case 'recover':
                        content = this.renderRecover();
                        break;
                    default:
                        content = this.renderMenu();
                }
                
                app.innerHTML = content;
                
                // Restore scroll position to prevent jumping
                if (scrollPos > 0) {
                    window.scrollTo(0, scrollPos);
                }
                
                // Restore focus and cursor position to input field
                if (activeElementId) {
                    const elementToFocus = document.querySelector(`[data-input-id="${activeElementId}"]`);
                    if (elementToFocus) {
                        elementToFocus.focus();
                        if (cursorPosition !== null && elementToFocus.setSelectionRange) {
                            elementToFocus.setSelectionRange(cursorPosition, cursorPosition);
                        }
                    }
                }
                
                // Re-attach touch gestures for flashcards
                if (state.mode === 'flashcards') {
                    const flashcardEl = document.querySelector('.flashcard');
                    if (flashcardEl) {
                        new TouchGestureHandler(flashcardEl, {
                            onSwipeLeft: () => this.nextFlashcard(),
                            onSwipeRight: () => this.previousFlashcard()
                        });
                    }
                }
            }

            renderMenu() {
                const state = this.stateManager.state;
                const streak = state.studyStreak;
                const dueCards = this.getDueCardsCount();
                const menuCategory = state.menuCategory || null; // null, 'study', or 'actions'
                
                return `
                    <div class="container animate-fadeIn">
                        <!-- Header -->
                        <div class="flex justify-between items-center mb-8">
                            <div>
                                <h1 class="text-4xl font-bold">普通话 Study</h1>
                                <p class="text-secondary mt-2" style="color: var(--text-secondary)">Master Mandarin with smart learning</p>
                            </div>
                            <button onclick="app.stateManager.toggleTheme()" class="btn btn-icon btn-ghost" title="Toggle theme">
                                ${this.stateManager.theme === 'dark' ? '☀️' : '🌙'}
                            </button>
                        </div>

                        <!-- Study Streak -->
                        ${streak > 0 ? `
                            <div class="card mb-6" style="background: linear-gradient(135deg, var(--accent-light) 0%, var(--bg-card) 100%);">

                                    <div class="text-4xl">🔥</div>

                                </div>
                            </div>

                        <!-- Category Selector or Back Button -->
                        ${menuCategory ? `
                            <div class="mb-6">
                                <button onclick="app.setMenuCategory(null)" class="btn btn-ghost">
                                    ← Back to Menu
                                </button>
                            </div>
                        ` : `
                            <!-- Main Category Buttons -->
                            <div class="grid grid-cols-2 gap-4 mb-8">
                                <button 
                                    onclick="app.setMenuCategory('study')" 
                                    class="card card-interactive"
                                    style="padding: 2rem; text-align: center;"
                                >
                                    <div class="text-5xl mb-3">📚</div>

                                    <div class="text-sm mt-2" style="color: var(--text-secondary)">Manage & customize</div>
                                </button>
                            </div>
                        `}

                        <!-- Study Modes (shown when category is 'study') -->
                        ${menuCategory === 'study' ? `
                            <div class="grid-responsive animate-fadeIn">
                                ${dueCards > 0 ? `
                                    <button onclick="app.startSRSReview()" class="card card-interactive">
                                        <div class="text-4xl mb-3">📚</div>
                                        <div class="text-xl font-semibold mb-2">SRS Review</div>
                                        <div class="text-sm" style="color: var(--text-secondary)">${dueCards} cards due</div>
                                    </button>
                                ` : ''}
                                <button onclick="app.selectMode('flashcards')" class="card card-interactive">
                                    <div class="text-4xl mb-3">🎴</div>
                                    <div class="text-xl font-semibold mb-2">Flashcards</div>
                                    <div class="text-sm" style="color: var(--text-secondary)">Classic review</div>
                                </button>
                                <button onclick="app.selectMode('quiz')" class="card card-interactive">
                                    <div class="text-4xl mb-3">✏️</div>
                                    <div class="text-xl font-semibold mb-2">Quiz</div>
                                    <div class="text-sm" style="color: var(--text-secondary)">Test yourself</div>
                                </button>
                                <button onclick="app.selectMode('sentenceBuilder')" class="card card-interactive">
                                    <div class="text-4xl mb-3">🧩</div>
                                    <div class="text-xl font-semibold mb-2">Sentence Builder</div>
                                    <div class="text-sm" style="color: var(--text-secondary)">Build sentences</div>

                                </button>

                                        <div class="text-4xl mb-3">❌</div>
                                        <div class="text-xl font-semibold mb-2">Mistake Review</div>

                                </button>

                                    <div class="text-4xl mb-3">♻️</div>
                                    <div class="text-xl font-semibold mb-2">Recover Units</div>
                                    <div class="text-sm" style="color: var(--text-secondary)">Restore deleted units</div>
                                </button>
                                <button onclick="app.goToStats()" class="card card-interactive">
                                    <div class="text-4xl mb-3">📊</div>
                                    <div class="text-xl font-semibold mb-2">Statistics</div>
                                    <div class="text-sm" style="color: var(--text-secondary)">View progress</div>
                                </button>
                                <button onclick="app.goToSettings()" class="card card-interactive">
                                    <div class="text-4xl mb-3">⚙️</div>
                                    <div class="text-xl font-semibold mb-2">Settings</div>
                                    <div class="text-sm" style="color: var(--text-secondary)">Customize app</div>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            renderSelectUnits() {
                const state = this.stateManager.state;
                const allUnits = this.getAllUnits();
                
                return `
                    <div class="container animate-fadeIn">
                        <!-- Header -->
                        <div class="flex justify-between items-center mb-6">

                            <button onclick="app.goToMenu()" class="btn btn-ghost">
                                ← Back
                            </button>
                        </div>

                        <div class="mb-6">
                            <div class="flex gap-3 mb-4">
                                <button onclick="app.selectAllUnits()" class="btn btn-secondary">Select All</button>

                            </div>
                            
                            <div class="grid-responsive">
                                ${Object.entries(allUnits).map(([key, unit]) => {
                                    const isSelected = state.selectedUnits.includes(key);

                                                <div class="flex items-center justify-between mb-2">
                                                    <div class="text-xl font-semibold">${unit.name}</div>
                                                    <div class="text-2xl">${isSelected ? '✓' : ''}</div>

                                        </div>
